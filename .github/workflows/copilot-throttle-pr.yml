name: Copilot Throttle (PR assigned → ready + approve; merge only when green)

on:
  pull_request_target:
    types: [assigned]

concurrency:
  group: copilot-throttle
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  throttle:
    runs-on: ubuntu-latest
    steps:
      - name: Auth gh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "GH_TOKEN=${GH_TOKEN}" >> "$GITHUB_ENV"
          echo "REPO=${{ github.repository }}" >> "$GITHUB_ENV"

      - name: Capture PR context
        id: ctx
        run: |
          echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          echo "assignee=${{ github.event.assignee.login }}" >> "$GITHUB_OUTPUT"

      - name: Exit if assignee is not Copilot
        if: ${{ steps.ctx.outputs.assignee != 'Copilot' }}
        run: echo "Not Copilot; skipping."

      - name: Check if Copilot already assigned elsewhere
        if: ${{ steps.ctx.outputs.assignee == 'Copilot' }}
        id: busy
        run: |
          set -euo pipefail
          CURRENT="${{ steps.ctx.outputs.pr }}"
          JSON=$(gh pr list -R "$REPO" --state open --json number,assignees)
          BUSY=$(jq --arg cur "$CURRENT" '
            [ .[] | select(.number != ($cur|tonumber))
                  | select([.assignees[].login?] | index("Copilot")) ] | length
          ' <<< "$JSON")
          echo "busy=$BUSY" >> "$GITHUB_OUTPUT"

      - name: De-assign (Copilot is busy elsewhere)
        if: ${{ steps.busy.outputs.busy != '0' }}
        run: |
          PR="${{ steps.ctx.outputs.pr }}"
          gh pr edit -R "$REPO" "$PR" --remove-assignee "Copilot" || true
          gh pr comment -R "$REPO" "$PR" --body "⏸️ Copilot is already working on another PR. It will be picked up automatically when free."

      - name: Ready for review + clean title + approve
        if: ${{ steps.busy.outputs.busy == '0' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.ctx.outputs.pr }}"
          gh pr ready -R "$REPO" "$PR" || true
          TITLE=$(gh pr view -R "$REPO" "$PR" --json title -q .title)
          CLEAN=$(printf "%s" "$TITLE" \
            | sed -E 's/^[[:space:]]*\[?[Ww][Ii][Pp]\]?[[:space:]]*[:\-]*[[:space:]]*//' \
            | sed -E 's/^[[:space:]]*\[?[Dd]raft\]?[[:space:]]*[:\-]*[[:space:]]*//')
          if [ "$CLEAN" != "$TITLE" ] && [ -n "$CLEAN" ]; then
            gh pr edit -R "$REPO" "$PR" --title "$CLEAN"
          fi
          gh pr review -R "$REPO" "$PR" --approve -b "Auto-approved by throttle"

      # Only merge when mergeable AND CI is SUCCESS
      - name: Merge only when green
        if: ${{ steps.busy.outputs.busy == '0' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR="${{ steps.ctx.outputs.pr }}"
          OWNER="${GITHUB_REPOSITORY%/*}"
          NAME="${GITHUB_REPOSITORY#*/}"

          # Query PR merge state + head SHA
          pr_json=$(gh api graphql -f owner="$OWNER" -f name="$NAME" -F pr="$PR" -f query='
            query($owner:String!,$name:String!,$pr:Int!){
              repository(owner:$owner,name:$name){
                pullRequest(number:$pr){
                  isDraft
                  mergeStateStatus
                  headRefOid
                }
              }
            }')
          isDraft=$(jq -r '.data.repository.pullRequest.isDraft' <<<"$pr_json")
          mergeState=$(jq -r '.data.repository.pullRequest.mergeStateStatus' <<<"$pr_json")
          sha=$(jq -r '.data.repository.pullRequest.headRefOid' <<<"$pr_json")

          # Query CI rollup on that commit
          rollup=$(gh api graphql -f owner="$OWNER" -f name="$NAME" -F sha="$sha" -f query='
            query($owner:String!,$name:String!,$sha:GitObjectID!){
              repository(owner:$owner,name:$name){
                object(oid:$sha){
                  ... on Commit { statusCheckRollup { state } }
                }
              }
            }')
          state=$(jq -r '.data.repository.object.statusCheckRollup.state // "PENDING"' <<<"$rollup")

          echo "draft=$isDraft mergeState=$mergeState checks=$state"
          if [[ "$isDraft" == "false" && "$state" == "SUCCESS" && "$mergeState" != "BLOCKED" ]]; then
            gh pr merge -R "$REPO" "$PR" --squash --delete-branch
          else
            echo "Not green/mergeable yet → leaving unmerged (no auto-merge toggle)."
          fi



