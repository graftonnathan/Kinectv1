name: Copilot Throttle (issues.assigned only)

on:
  issues:
    types: [assigned]

concurrency:
  group: copilot-throttle
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  QUEUE_LABEL: "copilot:todo"
  COPILOT_HANDLE: "Copilot"   # match the assignee login exactly

jobs:
  throttle:
    name: Re-queue if Copilot already busy
    if: >
      github.event_name == 'issues' &&
      github.event.issue.pull_request &&
      github.event.assignee &&
      github.event.assignee.login == env.COPILOT_HANDLE
    runs-on: ubuntu-latest
    steps:
      - name: Auth gh
        run: echo "GH_TOKEN=${{ github.token }}" >> "$GITHUB_ENV"

      - name: Determine PR number
        id: prnum
        run: |
          echo "pr=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"

      - name: Check for other open PRs already assigned to Copilot
        id: check_busy
        run: |
          set -euo pipefail
          CURRENT="${{ steps.prnum.outputs.pr }}"
          JSON=$(gh pr list --state open --json number,assignees)
          BUSY=$(jq --arg u "${COPILOT_HANDLE}" --arg cur "$CURRENT" '
            [ .[]
              | select(.number != ($cur|tonumber))
              | select([.assignees[].login?] | index($u))
            ] | length ' <<< "$JSON")
          echo "busy=$BUSY" >> "$GITHUB_OUTPUT"

      - name: Re-queue this PR (remove Copilot, add label, comment)
        if: steps.check_busy.outputs.busy != '0'
        run: |
          set -euo pipefail
          PR="${{ steps.prnum.outputs.pr }}"
          gh pr edit "$PR" --remove-assignee "${COPILOT_HANDLE}" || true
          gh pr edit "$PR" --add-label "$QUEUE_LABEL" || true
          gh pr comment "$PR" --body "⏳ Copilot is already working on another PR. This one is queued with \`$QUEUE_LABEL\` and will be auto-assigned when free."
