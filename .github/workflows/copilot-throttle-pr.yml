name: Copilot Throttle (PR assigned → approve & automerge, no labels)

on:
  pull_request_target:
    types: [assigned]

concurrency:
  group: copilot-throttle
  cancel-in-progress: true

permissions:
  contents: write        # needed to enable auto-merge & delete branch
  pull-requests: write   # needed to edit assignees & submit reviews
  issues: write

jobs:
  throttle:
    runs-on: ubuntu-latest
    steps:
      - name: Auth gh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "GH_TOKEN=${GH_TOKEN}" >> "$GITHUB_ENV"
          echo "REPO=${{ github.repository }}" >> "$GITHUB_ENV"
          gh --version

      - name: Capture PR context
        id: ctx
        run: |
          echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          echo "assignee=${{ github.event.assignee.login }}" >> "$GITHUB_OUTPUT"

      - name: Exit if assignee is not Copilot
        if: steps.ctx.outputs.assignee != 'Copilot'
        run: echo "Not Copilot; skipping."

      - name: Check if Copilot is already assigned elsewhere
        if: steps.ctx.outputs.assignee == 'Copilot'
        id: busy
        run: |
          set -euo pipefail
          CURRENT="${{ steps.ctx.outputs.pr }}"
          JSON=$(gh pr list -R "$REPO" --state open --json number,assignees)
          BUSY=$(jq --arg cur "$CURRENT" '
            [ .[]
              | select(.number != ($cur|tonumber))
              | select([.assignees[].login?] | index("Copilot"))
            ] | length ' <<< "$JSON")
          echo "busy=$BUSY" >> "$GITHUB_OUTPUT"

      - name: De-assign (Copilot is busy elsewhere)
        if: steps.ctx.outputs.assignee == 'Copilot' && steps.busy.outputs.busy != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.ctx.outputs.pr }}"
          gh pr edit -R "$REPO" "$PR" --remove-assignee "Copilot" || true
          gh pr comment -R "$REPO" "$PR" --body "⏸️ Copilot is already working on another PR. It will be picked up automatically when free."

      - name: Auto-approve (Copilot is free)
        if: steps.ctx.outputs.assignee == 'Copilot' && steps.busy.outputs.busy == '0'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.ctx.outputs.pr }}"
          gh pr review -R "$REPO" "$PR" --approve -b "Auto-approved for Copilot automerge"

      - name: Enable Auto-Merge (squash + delete branch)
        if: steps.ctx.outputs.assignee == 'Copilot' && steps.busy.outputs.busy == '0'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.ctx.outputs.pr }}"
          gh pr merge -R "$REPO" "$PR" --auto --squash --delete-branch || true

          PR="${{ steps.guard.outputs.pr }}"
          gh pr merge -R "$REPO" "$PR" --auto --squash --delete-branch || true

