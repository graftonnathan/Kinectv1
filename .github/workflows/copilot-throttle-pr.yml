name: Copilot Throttle (review_requested → ready + approve; no labels)

on:
  pull_request_target:
    types: [review_requested]

concurrency:
  group: copilot-throttle
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  throttle:
    runs-on: ubuntu-latest
    steps:
      - name: Auth gh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "GH_TOKEN=${GH_TOKEN}" >> "$GITHUB_ENV"
          echo "REPO=${{ github.repository }}" >> "$GITHUB_ENV"
          gh --version

      - name: Capture PR & reviewer
        id: ctx
        run: |
          echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          echo "reviewer=${{ github.event.requested_reviewer.login }}" >> "$GITHUB_OUTPUT"

      - name: Exit if reviewer is not Copilot
        if: ${{ steps.ctx.outputs.reviewer != 'Copilot' }}
        run: echo "Not Copilot; skipping."

      - name: Is Copilot already requested elsewhere?
        if: ${{ steps.ctx.outputs.reviewer == 'Copilot' }}
        id: busy
        run: |
          set -euo pipefail
          CURRENT="${{ steps.ctx.outputs.pr }}"
          BUSY=$(gh pr list -R "$REPO" --search "is:open review-requested:Copilot" -L 100 --json number \
                 | jq --arg cur "$CURRENT" '[.[] | select(.number != ($cur|tonumber))] | length')
          echo "busy=$BUSY" >> "$GITHUB_OUTPUT"

      - name: Remove Copilot here (already busy elsewhere)
        if: ${{ steps.busy.outputs.busy != '0' }}
        run: |
          PR="${{ steps.ctx.outputs.pr }}"
          gh pr edit -R "$REPO" "$PR" --remove-reviewer "Copilot" || true
          gh pr comment -R "$REPO" "$PR" --body "⏸️ Copilot is already working on another PR. It'll be requested here when free."

      - name: Mark ready & clean WIP/Draft title
        if: ${{ steps.busy.outputs.busy == '0' }}
        shell: bash
        run: |
          PR="${{ steps.ctx.outputs.pr }}"
          gh pr ready -R "$REPO" "$PR" || true
          TITLE=$(gh pr view -R "$REPO" "$PR" --json title -q .title)
          CLEAN=$(printf "%s" "$TITLE" \
            | sed -E 's/^[[:space:]]*\[?[Ww][Ii][Pp]\]?[[:space:]]*[:\-]*[[:space:]]*//' \
            | sed -E 's/^[[:space:]]*\[?[Dd]raft\]?[[:space:]]*[:\-]*[[:space:]]*//')
          if [ "$CLEAN" != "$TITLE" ] && [ -n "$CLEAN" ]; then
            gh pr edit -R "$REPO" "$PR" --title "$CLEAN"
          fi

      - name: Auto-approve (best effort)
        if: ${{ steps.busy.outputs.busy == '0' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.ctx.outputs.pr }}"
          gh pr review -R "$REPO" "$PR" --approve -b "Auto-approved by throttle (ready for CI)."




