name: Copilot Throttle (no relabel + auto-approve/automerge)

on:
  issues:
    types: [assigned]

concurrency:
  group: copilot-throttle
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  issues: write

jobs:
  throttle:
    # Only when an assignee exists, it's a PR (not a plain issue), and it's Copilot
    if: ${{ github.event.issue.pull_request && github.event.assignee && github.event.assignee.login == env.COPILOT_HANDLE }}
    runs-on: ubuntu-latest
    env:
      COPILOT_HANDLE: Copilot           # change if your Copilot login differs
      MERGE_METHOD: squash              # merge | squash | rebase
      DELETE_BRANCH: "true"
      REVIEW_TOKEN: ${{ secrets.GH_PAT || github.token }}
    steps:
      - name: Auth gh
        run: echo "GH_TOKEN=${{ env.REVIEW_TOKEN }}" >> "$GITHUB_ENV"

      - name: Determine PR number
        id: prnum
        run: echo "pr=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"

      - name: Check if Copilot already assigned elsewhere
        id: busy
        run: |
          set -euo pipefail
          CURRENT="${{ steps.prnum.outputs.pr }}"
          JSON=$(gh pr list --state open --json number,assignees)
          BUSY=$(jq --arg u "${{ env.COPILOT_HANDLE }}" --arg cur "$CURRENT" '
            [ .[]
              | select(.number != ($cur|tonumber))
              | select([.assignees[].login?] | index($u))
            ] | length ' <<< "$JSON")
          echo "busy=$BUSY" >> "$GITHUB_OUTPUT"

      - name: If busy, just remove Copilot assignment (no relabel)
        if: ${{ steps.busy.outputs.busy != '0' }}
        run: |
          set -euo pipefail
          PR="${{ steps.prnum.outputs.pr }}"
          gh pr edit "$PR" --remove-assignee "${{ env.COPILOT_HANDLE }}" || true
          gh pr comment "$PR" --body "⏳ Copilot is already working on another PR. Unassigning for now; it will be assigned automatically when free."
      
      - name: If not busy, auto-approve and enable automerge
        if: ${{ steps.busy.outputs.busy == '0' }}
        run: |
          set -euo pipefail
          PR="${{ steps.prnum.outputs.pr }}"
          # Best-effort approval
          gh pr review "$PR" --approve -b "Auto-approved for Copilot automerge"
          # Enable auto-merge
          args=( --auto "--${{ env.MERGE_METHOD }}" )
          [[ "${{ env.DELETE_BRANCH }}" == "true" ]] && args+=( "--delete-branch" )
          gh pr merge "$PR" "${args[@]}"
          gh pr comment "$PR" --body "✅ Auto-approval added and auto-merge enabled. Will merge when required checks pass."
