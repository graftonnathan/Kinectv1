name: Copilot Throttle (one assignment at a time, fixed)

on:
  pull_request_target:
    types: [assigned]

concurrency:
  group: copilot-throttle
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  QUEUE_LABEL: "copilot:todo"
  INPROGRESS_LABEL: "copilot:in-progress"
  COPILOT_HANDLE: "Copilot"   # change if your Copilot assignee name differs (case-sensitive)

jobs:
  enforce-single-assignment:
    if: github.event.action == 'assigned' && contains(github.event.pull_request.assignees.*.login, env.COPILOT_HANDLE)
    runs-on: ubuntu-latest
    steps:
      - name: Auth gh
        run: echo "GH_TOKEN=${{ github.token }}" >> "$GITHUB_ENV"

      - name: Find other open PRs already assigned to Copilot
        id: find_existing
        run: |
          set -euo pipefail
          CURRENT="${{ github.event.pull_request.number }}"
          JSON=$(gh pr list --state open --json number,assignees)
          COUNT=$(jq --arg u "${COPILOT_HANDLE}" --arg cur "$CURRENT" '
            [ .[]
              | select(.number != ($cur|tonumber))
              | select([.assignees[].login?] | index($u))
            ] | length ' <<< "$JSON")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Re-queue this PR if Copilot is already busy
        if: steps.find_existing.outputs.count != '0'
        run: |
          set -euo pipefail
          PR="${{ github.event.pull_request.number }}"
          echo "Another Copilot assignment exists; re-queuing PR #$PR"
          gh pr edit "$PR" --remove-assignee "${COPILOT_HANDLE}" || true
          gh pr edit "$PR" --add-label "$QUEUE_LABEL" || true
          gh pr comment "$PR" --body "⏳ Copilot is busy with another PR. This PR has been **queued** via label \`$QUEUE_LABEL\` and will be auto-assigned when free."
