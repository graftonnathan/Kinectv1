name: Copilot Throttle (no labels, auto-approve & automerge)

on:
  issues:
    types: [assigned]

concurrency:
  group: copilot-throttle
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  throttle:
    runs-on: ubuntu-latest
    steps:
      - name: Auth gh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "GH_TOKEN=${GH_TOKEN}" >> "$GITHUB_ENV"
          gh --version

      # Guard: only act for PRs and only when assignee is *Copilot*
      - name: Guard & capture PR number
        id: guard
        run: |
          # Is this an issue that is actually a PR?
          if [ -z "${{ github.event.issue.pull_request }}" ]; then
            echo "is_pr=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "is_pr=true" >> $GITHUB_OUTPUT
          echo "pr=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT

          # Is the assignee Copilot (exact login)?
          if [ "${{ github.event.assignee.login }}" = "Copilot" ]; then
            echo "is_copilot=true" >> $GITHUB_OUTPUT
          else
            echo "is_copilot=false" >> $GITHUB_OUTPUT
          fi

      - name: Exit if not a PR or not Copilot
        if: steps.guard.outputs.is_pr != 'true' || steps.guard.outputs.is_copilot != 'true'
        run: echo "Throttle skipping (not a PR or assignee is not Copilot)."

      - name: Check if Copilot already assigned elsewhere
        if: steps.guard.outputs.is_pr == 'true' && steps.guard.outputs.is_copilot == 'true'
        id: busy
        run: |
          set -euo pipefail
          CURRENT="${{ steps.guard.outputs.pr }}"
          JSON=$(gh pr list --state open --json number,assignees)
          BUSY=$(jq --arg cur "$CURRENT" '
            [ .[]
              | select(.number != ($cur|tonumber))
              | select([.assignees[].login?] | index("Copilot"))
            ] | length ' <<< "$JSON")
          echo "busy=$BUSY" >> "$GITHUB_OUTPUT"

      - name: De-assign (Copilot is busy elsewhere)
        if: steps.busy.outputs.busy != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.guard.outputs.pr }}"
          gh pr edit "$PR" --remove-assignee "Copilot" || true
          gh pr comment "$PR" --body "⏸️ Copilot is already working on another PR. This one will be picked up automatically when free."

      - name: Auto-approve (Copilot is free)
        if: steps.busy.outputs.busy == '0'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.guard.outputs.pr }}"
          # Approve (PAT recommended so the review counts under branch protection)
          gh pr review "$PR" --approve -b "Auto-approved for Copilot automerge"

      - name: Enable Auto-Merge (squash + delete branch)
        if: steps.busy.outputs.busy == '0'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.guard.outputs.pr }}"
          gh pr merge "$PR" --auto --squash --delete-branch || true
