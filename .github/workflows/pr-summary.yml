      - name: Notify Discord (only if webhook is configured)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "No DISCORD_WEBHOOK_URL set; skipping Discord notification."
            exit 0
          fi

          REPO="${{ github.repository }}"
          NUMBER="${{ github.event.pull_request.number }}"
          TITLE="${{ github.event.pull_request.title }}"
          URL="${{ github.event.pull_request.html_url }}"
          ACTOR="${{ github.actor }}"
          BASE="${{ github.event.pull_request.base.ref }}"

          # Build a single-line/safe multi-line message in bash (no YAML quoting issues)
          MSG=$(printf '[%s] PR #%s → %s by @%s\n%s\n%s\n' \
                "$REPO" "$NUMBER" "$BASE" "$ACTOR" "$TITLE" "$URL")

          # Make MSG visible to the Python process
          export MSG

          # Create JSON payload without jq
          python - <<'PY'
import json, os
content = os.environ.get("MSG","")
with open("payload.json","w", encoding="utf-8") as f:
    f.write(json.dumps({"content": content}))
PY

          curl -sS -X POST -H "Content-Type: application/json" \
            --data-binary @payload.json \
            "$DISCORD_WEBHOOK_URL" || echo "Discord post failed (non-blocking)."
