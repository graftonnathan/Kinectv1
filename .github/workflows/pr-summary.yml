name: PR Summary

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR HEAD
        uses: actions/checkout@v4
        with:
          # Check out the PR head commit explicitly
          ref: ${{ github.event.pull_request.head.sha }}
          # Shallow is fine; we'll fetch the base commit by SHA next
          fetch-depth: 1

      - name: Fetch base commit by SHA
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          echo "Base ref: ${{ github.base_ref }}"
          echo "Base sha: $BASE_SHA"
          # Ensure we have the base commit locally
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"

      - name: Create diffstat summary (base...head)
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          echo "### Change summary" > summary.md
          echo "" >> summary.md

          echo '```' >> summary.md
          git diff --stat "${BASE_SHA}...${HEAD_SHA}" >> summary.md || true
          echo '```' >> summary.md

          echo "" >> summary.md
          echo "### Key files touched" >> summary.md
          echo "" >> summary.md

          echo '```' >> summary.md
          git diff --name-only "${BASE_SHA}...${HEAD_SHA}" >> summary.md || true
          echo '```' >> summary.md

      - name: Post sticky comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: summary.md
