name: PR Summary
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # get full history so we can diff reliably
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Ensure base & head SHAs are present
        run: |
          set -e
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          # Fetch the exact commits in case they aren't in the local clone yet
          git fetch --no-tags --depth=1 origin $BASE_SHA $HEAD_SHA

          echo "### Change summary" > summary.md
          echo "" >> summary.md
          echo '```' >> summary.md
          git diff --stat --color=never "$BASE_SHA...$HEAD_SHA" >> summary.md
          echo '```' >> summary.md
          echo "" >> summary.md
          echo "### Key files touched" >> summary.md
          echo "" >> summary.md
          echo '```' >> summary.md
          git diff --name-only "$BASE_SHA...$HEAD_SHA" >> summary.md
          echo '```' >> summary.md

      - name: Post sticky comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: summary.md

