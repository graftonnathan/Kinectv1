name: PR Summary
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Create diffstat summary
        run: |
          echo "### Change summary" > summary.md
          echo "" >> summary.md
          echo '```' >> summary.md
          git diff --stat master/${{ github.base_ref }}...HEAD >> summary.md
          echo '```' >> summary.md
          echo "" >> summary.md
          echo "### Key files touched" >> summary.md
          echo "" >> summary.md
          echo '```' >> summary.md
          git diff --name-only master/${{ github.base_ref }}...HEAD >> summary.md
          echo '```' >> summary.md

      - name: Post sticky comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: summary.md
