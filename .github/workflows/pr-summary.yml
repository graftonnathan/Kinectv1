name: PR Summary

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
        with:
          # shallow clone is fine; we’ll fetch just dev explicitly
          fetch-depth: 1

      - name: Ensure origin/dev is available
        run: |
          git fetch --no-tags --prune --depth=1 origin +refs/heads/dev:refs/remotes/origin/dev

      - name: Create diffstat summary vs dev
        run: |
          echo "### Change summary" > summary.md
          echo "" >> summary.md
          echo '```' >> summary.md
          git diff --stat origin/dev...HEAD >> summary.md
          echo '```' >> summary.md
          echo "" >> summary.md
          echo "### Key files touched" >> summary.md
          echo "" >> summary.md
          echo '```' >> summary.md
          git diff --name-only origin/dev...HEAD >> summary.md
          echo '```' >> summary.md

      - name: Post sticky comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: summary.md
