name: Process PR queue (one at a time, no labels; GraphQL-based)

on:
  schedule:
    - cron: "*/4 * * * *"         # every 4 minutes
  workflow_dispatch:

concurrency:
  group: copilot-orchestrator
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  COPILOT_USER: "Copilot"                 # what the UI shows
  COPILOT_APP_SLUGS: "copilot,github-copilot"  # try both just in case
  MERGE_METHOD: squash                    # squash | merge | rebase
  MAX_WAIT_MINUTES: "45"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Setup gh auth
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "GH_TOKEN=${GH_TOKEN}" >> "$GITHUB_ENV"
          echo "REPO=${{ github.repository }}" >> "$GITHUB_ENV"
          echo "OWNER=${GITHUB_REPOSITORY%/*}" >> "$GITHUB_ENV"
          echo "NAME=${GITHUB_REPOSITORY#*/}"  >> "$GITHUB_ENV"
          gh --version

      # ---- Discover active & next via GraphQL (reliable with GitHub Apps) ----
      - name: Discover active & next PR
        id: choose
        shell: bash
        run: |
          set -euo pipefail
          readarray -td, APP_SLUGS <<< "${{ env.COPILOT_APP_SLUGS }}"; unset 'APP_SLUGS[-1]'
          APP_JQ_FILTER=$(printf '("%s") or ' "${APP_SLUGS[@]}"; echo 'false')

          QUERY='
            query($owner:String!,$name:String!){
              repository(owner:$owner,name:$name){
                pullRequests(states:OPEN, first:100, orderBy:{field:UPDATED_AT,direction:ASC}){
                  nodes{
                    number
                    updatedAt
                    isDraft
                    headRefName
                    author{ login }
                    reviewRequests(first:20){
                      nodes{
                        requestedReviewer{
                          __typename
                          ... on User{ login }
                          ... on App{ slug }
                          ... on Team{ slug organization{ login } }
                        }
                      }
                    }
                  }
                }
              }
            }'

          resp=$(gh api graphql -f owner="$OWNER" -f name="$NAME" -f query="$QUERY")
          prs=$(jq -c '.data.repository.pullRequests.nodes' <<<"$resp")

          # Helper: does PR already request Copilot (user OR app slug)?
          with_copilot=$(jq '[.[] |
            select( any(.reviewRequests.nodes[]?.requestedReviewer?;
                        (.requestedReviewer.__typename=="User" and .requestedReviewer.login=="'${{ env.COPILOT_USER }}'")
                     or (.requestedReviewer.__typename=="App"  and ( .requestedReviewer.slug | test('${APP_JQ_FILTER}')) )
            )) ]' <<<"$prs")

          active=$(jq -r '.[0].number // empty' <<<"$with_copilot")  # oldest with Copilot requested

          # Candidates = open PRs that DO NOT already request Copilot
          candidates=$(jq '[ .[] | select( any(.reviewRequests.nodes[]?.requestedReviewer?;
                              (.requestedReviewer.__typename=="User" and .requestedReviewer.login=="'${{ env.COPILOT_USER }}'")
                           or (.requestedReviewer.__typename=="App" and ( .requestedReviewer.slug | test('${APP_JQ_FILTER}')) )
                           ) | not ) ]' <<<"$prs")

          pick=$(jq -r '.[0].number // empty' <<<"$candidates")      # oldest without Copilot

          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "pick=$pick"     >> "$GITHUB_OUTPUT"

      # Keep only one active: if there are multiple with Copilot requested, drop Copilot from the extras
      - name: Enforce single active (remove Copilot from extras)
        if: ${{ steps.choose.outputs.active != '' }}
        shell: bash
        run: |
          set -euo pipefail
          # Recompute the full list so we can drop extras
          resp=$(gh api graphql -f owner="$OWNER" -f name="$NAME" -f query='
            query($owner:String!,$name:String!){
              repository(owner:$owner,name:$name){
                pullRequests(states:OPEN, first:100, orderBy:{field:UPDATED_AT,direction:ASC}){
                  nodes{ number reviewRequests(first:20){
                    nodes{ requestedReviewer{ __typename ... on User{login} ... on App{slug} } }
                  }}
                }
              }
            }')
          prs=$(jq -c '.data.repository.pullRequests.nodes' <<<"$resp")
          # Map PR number -> has Copilot
          echo "$prs" | jq -r \
            --arg user "${{ env.COPILOT_USER }}" \
            --argjson slugs "$(printf '%s\n' "${{ env.COPILOT_APP_SLUGS }}" | jq -R 'split(",")')" \
            --arg act "${{ steps.choose.outputs.active }}" '
              .[]
              | {n:.number, has: (any(.reviewRequests.nodes[]?.requestedReviewer?;
                          (.requestedReviewer.__typename=="User" and .requestedReviewer.login==$user)
                       or (.requestedReviewer.__typename=="App" and (.requestedReviewer.slug | IN($slugs[]))) )) }
              | select(.has==true and (.n != ($act|tonumber)))
              | .n' \
          | while read -r n; do
              gh pr edit -R "$REPO" "$n" --remove-reviewer "app/Copilot"  || true
              gh pr edit -R "$REPO" "$n" --remove-reviewer "Copilot"      || true
              gh pr comment -R "$REPO" "$n" --body "⏸️ Copilot is busy with PR #${{ steps.choose.outputs.active }}; review request removed for now."
            done

      # If no active, request Copilot on the oldest candidate
      - name: Request Copilot on picked PR
        if: ${{ steps.choose.outputs.active == '' && steps.choose.outputs.pick != '' }}
        shell: bash
        run: |
          PR="${{ steps.choose.outputs.pick }}"
          echo "Requesting Copilot review on PR #$PR"
          # Try app reviewer first, then user handle as fallback
          gh pr edit -R "$REPO" "$PR" --add-reviewer "app/Copilot"  || \
          gh pr edit -R "$REPO" "$PR" --add-reviewer "Copilot"      || true
          gh pr comment -R "$REPO" "$PR" --body "🤖 Queued for **Copilot**."

      - name: Stop if nothing to do
        if: ${{ steps.choose.outputs.active == '' && steps.choose.outputs.pick == '' }}
        run: echo "Queue empty."

      # Focus PR is either the already-active one, or the one we just requested
      - name: Determine active PR number
        id: focus
        run: |
          echo "pr=${{ steps.choose.outputs.active || steps.choose.outputs.pick }}" >> "$GITHUB_OUTPUT"

      - name: Prepare active PR (ready + clean WIP/Draft)
        if: ${{ steps.focus.outputs.pr != '' }}
        shell: bash
        run: |
          PR="${{ steps.focus.outputs.pr }}"
          gh pr ready -R "$REPO" "$PR" || true
          TITLE=$(gh pr view -R "$REPO" "$PR" --json title -q .title)
          CLEAN=$(printf "%s" "$TITLE" \
            | sed -E 's/^[[:space:]]*\[?[Ww][Ii][Pp]\]?[[:space:]]*[:\-]*[[:space:]]*//' \
            | sed -E 's/^[[:space:]]*\[?[Dd]raft\]?[[:space:]]*[:\-]*[[:space:]]*//')
          if [ "$CLEAN" != "$TITLE" ] && [ -n "$CLEAN" ]; then
            gh pr edit -R "$REPO" "$PR" --title "$CLEAN"
          fi

      - name: Approve (counts with PAT; falls back to GITHUB_TOKEN)
        if: ${{ steps.focus.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.focus.outputs.pr }}"
          gh pr review -R "$REPO" "$PR" --approve -b "Auto-approved by orchestrator"

      - name: Wait for checks to pass, then merge
        if: ${{ steps.focus.outputs.pr != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR="${{ steps.focus.outputs.pr }}"
          limit=$(( ${{ env.MAX_WAIT_MINUTES }} * 60 ))
          interval=30
          elapsed=0
          echo "Waiting up to $limit seconds for checks on PR #$PR…"

          while (( elapsed < limit )); do
            pr_json=$(gh api graphql -f owner="$OWNER" -f name="$NAME" -F pr="$PR" -f query='
              query($owner:String!,$name:String!,$pr:Int!){
                repository(owner:$owner,name:$name){
                  pullRequest(number:$pr){
                    isDraft
                    mergeStateStatus
                    headRefOid
                  }
                }
              }')
            isDraft=$(jq -r '.data.repository.pullRequest.isDraft' <<<"$pr_json")
            mergeState=$(jq -r '.data.repository.pullRequest.mergeStateStatus' <<<"$pr_json")
            sha=$(jq -r '.data.repository.pullRequest.headRefOid' <<<"$pr_json")

            rollup=$(gh api graphql -f owner="$OWNER" -f name="$NAME" -F sha="$sha" -f query='
              query($owner:String!,$name:String!,$sha:GitObjectID!){
                repository(owner:$owner,name:$name){
                  object(oid:$sha){ ... on Commit { statusCheckRollup { state } } }
                }
              }')
            state=$(jq -r '.data.repository.object.statusCheckRollup.state // "PENDING"' <<<"$rollup")

            echo "state=$state mergeState=$mergeState draft=$isDraft elapsed=${elapsed}s"
            if [[ "$isDraft" == "false" && "$state" == "SUCCESS" && "$mergeState" != "BLOCKED" ]]; then
              gh pr merge -R "$REPO" "$PR" --${{ env.MERGE_METHOD }} --delete-branch
              echo "Merged PR #$PR"
              exit 0
            fi
            sleep "$interval"
            elapsed=$(( elapsed + interval ))
          done

          echo "Checks not green in time; leaving PR #$PR open."
