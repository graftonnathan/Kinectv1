name: Process PR queue (one at a time; app-safe; auto-merge)

on:
  schedule:
    - cron: "*/4 * * * *"
  workflow_dispatch:

concurrency:
  group: copilot-orchestrator
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  # Copilot reviewer variants to try (left→right). Keep/adjust as needed.
  COPILOT_REVIEWERS: "app/github-copilot,app/Copilot,app/copilot,Copilot"
  MERGE_METHOD: squash
  MAX_WAIT_MINUTES: "45"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Setup gh auth
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "GH_TOKEN=${GH_TOKEN}" >> "$GITHUB_ENV"
          echo "REPO=${{ github.repository }}" >> "$GITHUB_ENV"
          echo "OWNER=${GITHUB_REPOSITORY%/*}" >> "$GITHUB_ENV"
          echo "NAME=${GITHUB_REPOSITORY#*/}"  >> "$GITHUB_ENV"
          gh --version

      # 1) Choose the focus PR = oldest open PR by updatedAt
      - name: Discover open PRs and pick focus
        id: pick
        shell: bash
        run: |
          set -euo pipefail
          list=$(gh pr list -R "$REPO" --state open --json number,updatedAt -L 200 \
                 | jq -r 'sort_by(.updatedAt) | .[].number')
          if [[ -z "$list" ]]; then
            echo "pr=" >> "$GITHUB_OUTPUT"
            echo "No open PRs."
            exit 0
          fi
          focus=$(printf "%s\n" "$list" | head -n1)
          echo "pr=$focus" >> "$GITHUB_OUTPUT"
          printf "%s\n" "$list" > /tmp/open_prs.txt
          echo "Focus PR: #$focus"

      - name: Stop if nothing to do
        if: ${{ steps.pick.outputs.pr == '' }}
        run: echo "Queue empty."

      # 2) Enforce single active: drop Copilot reviewer from all except focus
      - name: Remove Copilot from non-focus PRs (force; ignore errors)
        if: ${{ steps.pick.outputs.pr != '' }}
        shell: bash
        run: |
          set -euo pipefail
          focus="${{ steps.pick.outputs.pr }}"
          IFS=',' read -r -a RVS <<< "${{ env.COPILOT_REVIEWERS }}"
          while read -r n; do
            [[ "$n" = "$focus" ]] && continue
            for r in "${RVS[@]}"; do
              gh pr edit -R "$REPO" "$n" --remove-reviewer "$r" >/dev/null 2>&1 || true
            done
          done < /tmp/open_prs.txt

      # 3) Ensure Copilot is requested on focus
      - name: Request Copilot on focus PR (try app slugs first)
        if: ${{ steps.pick.outputs.pr != '' }}
        shell: bash
        run: |
          set -euo pipefail
          PR="${{ steps.pick.outputs.pr }}"
          IFS=',' read -r -a RVS <<< "${{ env.COPILOT_REVIEWERS }}"
          ok=""
          for r in "${RVS[@]}"; do
            if gh pr edit -R "$REPO" "$PR" --add-reviewer "$r" >/dev/null 2>&1; then
              echo "Requested reviewer: $r"
              ok="yes"
              break
            fi
          done
          if [[ -z "$ok" ]]; then
            echo "Warning: could not request Copilot (tried: ${RVS[*]}). Continuing anyway."
          fi
          gh pr comment -R "$REPO" "$PR" --body "🤖 Queue focusing PR #$PR."

      # 4) Prep & approve
      - name: Prepare focus PR (ready + clean WIP/Draft + approve)
        if: ${{ steps.pick.outputs.pr != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR="${{ steps.pick.outputs.pr }}"
          gh pr ready -R "$REPO" "$PR" || true
          TITLE=$(gh pr view -R "$REPO" "$PR" --json title -q .title)
          CLEAN=$(printf "%s" "$TITLE" \
            | sed -E 's/^[[:space:]]*\[?[Ww][Ii][Pp]\]?[[:space:]]*[:\-]*[[:space:]]*//' \
            | sed -E 's/^[[:space:]]*\[?[Dd]raft\]?[[:space:]]*[:\-]*[[:space:]]*//')
          if [ "$CLEAN" != "$TITLE" ] && [ -n "$CLEAN" ]; then
            gh pr edit -R "$REPO" "$PR" --title "$CLEAN"
          fi
          gh pr review -R "$REPO" "$PR" --approve -b "Auto-approved by orchestrator"

      # 5) Flip auto-merge now (squash); ignore if not allowed
      - name: Enable auto-merge (squash + delete branch)
        if: ${{ steps.pick.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.pick.outputs.pr }}"
          gh pr merge -R "$REPO" "$PR" --auto --${{ env.MERGE_METHOD }} --delete-branch || true

      # 6) Fallback: wait for green then merge ourselves
      - name: Wait for checks to pass, then merge
        if: ${{ steps.pick.outputs.pr != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR="${{ steps.pick.outputs.pr }}"
          OWNER="${GITHUB_REPOSITORY%/*}"
          NAME="${GITHUB_REPOSITORY#*/}"
          limit=$(( ${{ env.MAX_WAIT_MINUTES }} * 60 ))
          interval=30
          elapsed=0
          echo "Waiting up to $limit seconds for checks on PR #$PR…"
          while (( elapsed < limit )); do
            pr_json=$(gh api graphql -f owner="$OWNER" -f name="$NAME" -F pr="$PR" -f query='
              query($owner:String!,$name:String!,$pr:Int!){
                repository(owner:$owner,name:$name){
                  pullRequest(number:$pr){
                    isDraft
                    mergeStateStatus
                    headRefOid
                  }
                }
              }')
            isDraft=$(jq -r '.data.repository.pullRequest.isDraft' <<<"$pr_json")
            mergeState=$(jq -r '.data.repository.pullRequest.mergeStateStatus' <<<"$pr_json")
            sha=$(jq -r '.data.repository.pullRequest.headRefOid' <<<"$pr_json")
            rollup=$(gh api graphql -f owner="$OWNER" -f name="$NAME" -F sha="$sha" -f query='
              query($owner:String!,$name:String!,$sha:GitObjectID!){
                repository(owner:$owner,name:$name){
                  object(oid:$sha){ ... on Commit { statusCheckRollup { state } } }
                }
              }')
            state=$(jq -r '.data.repository.object.statusCheckRollup.state // "PENDING"' <<<"$rollup")
            echo "state=$state mergeState=$mergeState draft=$isDraft elapsed=${elapsed}s"
            if [[ "$isDraft" == "false" && "$state" == "SUCCESS" && "$mergeState" != "BLOCKED" ]]; then
              gh pr merge -R "$REPO" "$PR" --${{ env.MERGE_METHOD }} --delete-branch
              echo "Merged PR #$PR"
              exit 0
            fi
            sleep "$interval"
            elapsed=$(( elapsed + interval ))
          done
          echo "Checks not green in time; leaving PR #$PR open."

