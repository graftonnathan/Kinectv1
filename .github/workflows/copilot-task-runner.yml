name: Copilot Task Runner

on:
  # Reusable workflow: called by the dispatcher
  workflow_call:
    inputs:
      task:
        description: "Optional task identifier/name"
        required: false
        type: string
    secrets: {}  # allow secrets: inherit

permissions:
  contents: read
  pull-requests: write

jobs:
  summarize-and-notify:
    name: Build PR summary (+ optional Discord)
    runs-on: ubuntu-latest

    env:
      # Expose webhook as env; we'll test for emptiness inside the step.
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Debug event
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "base_ref=${{ github.base_ref }}"
          echo "head_ref=${{ github.head_ref }}"
          echo "ref=${{ github.ref }}"

      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure base ref is available
        run: |
          # Make sure the base branch exists locally (works for private repos too)
          git fetch --no-tags origin "${{ github.base_ref }}:${{ github.base_ref }}" || \
          git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Create diffstat summary
        run: |
          set -euo pipefail

          BASE="origin/${{ github.base_ref }}"
          if ! git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            # Fallback if origin/<base> isn't available under that refname
            BASE="${{ github.base_ref }}"
          fi

          echo "### Change summary" > summary.md
          echo "" >> summary.md
          echo '```' >> summary.md
          git diff --stat "$BASE...HEAD" >> summary.md || true
          echo '```' >> summary.md
          echo "" >> summary.md

          echo "### Files touched" >> summary.md
          echo "" >> summary.md
          echo '```' >> summary.md
          git diff --name-only "$BASE...HEAD" >> summary.md || true
          echo '```' >> summary.md

      - name: Post sticky comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: summary.md

      - name: Mirror summary to Discord (if configured)
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "No DISCORD_WEBHOOK_URL set; skipping Discord notify."
            exit 0
          fi

          # Trim summary to Discord-safe chunks (~1900 chars) and send sequentially.
          python - <<'PY'
import os, json, textwrap, requests
webhook = os.environ.get("DISCORD_WEBHOOK_URL","").strip()
if not webhook:
    raise SystemExit(0)

with open("summary.md","r",encoding="utf-8", errors="ignore") as f:
    body = f.read().strip()

prefix = f"[{os.environ.get('GITHUB_REPOSITORY')}] PR #{os.environ.get('GITHUB_REF_NAME','')} → {os.environ.get('GITHUB_BASE_REF','dev')} by @{os.environ.get('GITHUB_ACTOR')}\n"
title  = os.environ.get("GITHUB_EVENT_PULL_REQUEST_TITLE","") or os.environ.get("GITHUB_HEAD_REF","")
header = f"{prefix}{title}\n\n"

msg = (header + body).strip()
# Discord hard limit ~2000, keep margin
chunks = textwrap.wrap(msg, width=1900, replace_whitespace=False, drop_whitespace=False)

for part in chunks:
    payload = {"content": part}
    resp = requests.post(webhook, json=payload, timeout=15)
    try:
        resp.raise_for_status()
    except Exception as e:
        print("Discord post failed:", e, "status:", resp.status_code, "text:", resp.text)
PY
        env:
          GITHUB_EVENT_PULL_REQUEST_TITLE: ${{ github.event.pull_request.title || '' }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}

