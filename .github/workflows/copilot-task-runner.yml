name: Process PR queue (one at a time, no labels)

on:
  schedule:
    - cron: "*/4 * * * *"         # every 4 minutes
  workflow_dispatch:

concurrency:
  group: copilot-orchestrator
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  COPILOT_HANDLE: Copilot         # change if your Copilot login differs
  MERGE_METHOD: squash            # squash | merge | rebase
  MAX_WAIT_MINUTES: "45"          # how long to wait for checks to pass

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Setup gh auth
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "GH_TOKEN=${GH_TOKEN}" >> "$GITHUB_ENV"
          echo "REPO=${{ github.repository }}" >> "$GITHUB_ENV"
          gh --version

      # 1) See if there is already ONE active PR (review-requested:Copilot)
      - name: Find PRs with Copilot requested
        id: active
        run: |
          JSON=$(gh pr list -R "$REPO" \
                --search "is:open review-requested:${{ env.COPILOT_HANDLE }}" \
                --json number,updatedAt -L 1000)
          COUNT=$(jq 'length' <<< "$JSON")
          ACTIVE=$(jq -r 'sort_by(.updatedAt) | .[0].number // empty' <<< "$JSON")
          echo "count=$COUNT"  >> "$GITHUB_OUTPUT"
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "$JSON" > /tmp/active.json

      - name: Keep only one active (remove Copilot from extras)
        if: ${{ steps.active.outputs.count != '0' }}
        run: |
          act="${{ steps.active.outputs.active }}"
          jq -r --arg act "$act" '.[] | select(.number != ($act|tonumber)) | .number' /tmp/active.json \
          | while read -r n; do
              gh pr edit -R "$REPO" "$n" --remove-reviewer "${{ env.COPILOT_HANDLE }}" || true
              gh pr comment -R "$REPO" "$n" --body "⏸️ Copilot is busy with PR #$act; request removed for now."
            done

      # 2) If none active, pick the oldest OPEN PR where Copilot isn't already requested
      #    (drafts allowed; we'll mark ready below)
      - name: Pick next PR (oldest open PR without Copilot reviewer)
        if: ${{ steps.active.outputs.active == '' }}
        id: pick
        run: |
          set -euo pipefail
          PR=$(gh pr list -R "$REPO" \
               --search "is:open -review-requested:${{ env.COPILOT_HANDLE }}" \
               --json number,updatedAt -L 1000 \
               | jq -r 'sort_by(.updatedAt) | .[0].number // empty')
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Request Copilot review on picked PR
        if: ${{ steps.active.outputs.active == '' && steps.pick.outputs.pr != '' }}
        run: |
          PR="${{ steps.pick.outputs.pr }}"
          gh pr edit -R "$REPO" "$PR" --add-reviewer "${{ env.COPILOT_HANDLE }}" || true
          gh pr comment -R "$REPO" "$PR" --body "🤖 Queued for **${{ env.COPILOT_HANDLE }}**."

      - name: Stop if nothing to do
        if: ${{ steps.active.outputs.active == '' && steps.pick.outputs.pr == '' }}
        run: echo "Queue empty."

      # 3) Prepare the active PR (either existing active or the one we just picked)
      - name: Determine active PR number
        id: focus
        run: |
          echo "pr=${{ steps.active.outputs.active || steps.pick.outputs.pr }}" >> "$GITHUB_OUTPUT"

      - name: Prepare active PR (ready + clean WIP/Draft)
        if: ${{ steps.focus.outputs.pr != '' }}
        shell: bash
        run: |
          PR="${{ steps.focus.outputs.pr }}"
          gh pr ready -R "$REPO" "$PR" || true
          TITLE=$(gh pr view -R "$REPO" "$PR" --json title -q .title)
          CLEAN=$(printf "%s" "$TITLE" \
            | sed -E 's/^[[:space:]]*\[?[Ww][Ii][Pp]\]?[[:space:]]*[:\-]*[[:space:]]*//' \
            | sed -E 's/^[[:space:]]*\[?[Dd]raft\]?[[:space:]]*[:\-]*[[:space:]]*//')
          if [ "$CLEAN" != "$TITLE" ] && [ -n "$CLEAN" ]; then
            gh pr edit -R "$REPO" "$PR" --title "$CLEAN"
          fi

      - name: Approve (counts with PAT; falls back to GITHUB_TOKEN)
        if: ${{ steps.focus.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.focus.outputs.pr }}"
          gh pr review -R "$REPO" "$PR" --approve -b "Auto-approved by orchestrator"

      # 4) Wait for green, then merge (one-at-a-time)
      - name: Wait for checks to pass, then merge
        if: ${{ steps.focus.outputs.pr != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR="${{ steps.focus.outputs.pr }}"
          OWNER="${GITHUB_REPOSITORY%/*}"
          NAME="${GITHUB_REPOSITORY#*/}"
          limit=$(( ${{ env.MAX_WAIT_MINUTES }} * 60 ))
          interval=30
          elapsed=0
          echo "Waiting up to $limit seconds for checks on PR #$PR…"

          while (( elapsed < limit )); do
            pr_json=$(gh api graphql -f owner="$OWNER" -f name="$NAME" -F pr="$PR" -f query='
              query($owner:String!,$name:String!,$pr:Int!){
                repository(owner:$owner,name:$name){
                  pullRequest(number:$pr){
                    isDraft
                    mergeStateStatus
                    headRefOid
                  }
                }
              }')
            isDraft=$(jq -r '.data.repository.pullRequest.isDraft' <<<"$pr_json")
            mergeState=$(jq -r '.data.repository.pullRequest.mergeStateStatus' <<<"$pr_json")
            sha=$(jq -r '.data.repository.pullRequest.headRefOid' <<<"$pr_json")

            rollup=$(gh api graphql -f owner="$OWNER" -f name="$NAME" -F sha="$sha" -f query='
              query($owner:String!,$name:String!,$sha:GitObjectID!){
                repository(owner:$owner,name:$name){
                  object(oid:$sha){ ... on Commit { statusCheckRollup { state } } }
                }
              }')
            state=$(jq -r '.data.repository.object.statusCheckRollup.state // "PENDING"' <<<"$rollup")

            echo "state=$state mergeState=$mergeState draft=$isDraft elapsed=${elapsed}s"
            if [[ "$isDraft" == "false" && "$state" == "SUCCESS" && "$mergeState" != "BLOCKED" ]]; then
              gh pr merge -R "$REPO" "$PR" --${{ env.MERGE_METHOD }} --delete-branch
              echo "Merged PR #$PR"
              exit 0
            fi
            sleep "$interval"
            elapsed=$(( elapsed + interval ))
          done

          echo "Checks not green in time; leaving PR #$PR open."
