name: Copilot Task Runner

on:
  repository_dispatch:
    types: [copilot-task]
  workflow_dispatch:
    inputs:
      task_path:
        description: Path to a task file (e.g., .guidance/tasks/0012.yml)
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

# <- This is the single-file switch that enforces ONE active task at a time
concurrency:
  group: copilot-tasks
  cancel-in-progress: false

jobs:
  run-one-task:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TASK_PATH: ${{ github.event.client_payload.task_path || inputs.task_path }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse task file (title/summary)
        run: |
          python - <<'PY'
          import os, yaml, pathlib
          p = os.environ["TASK_PATH"]
          d = yaml.safe_load(open(p, 'r', encoding='utf-8')) or {}
          title = d.get('title') or d.get('name') or pathlib.Path(p).stem
          summary = d.get('summary') or d.get('goal') or ''
          tid = pathlib.Path(p).stem
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f"TASK_ID={tid}\n")
              f.write(f"TASK_TITLE={title}\n")
              f.write(f"TASK_SUMMARY={summary.replace('\n',' ')}\n")
          PY
        shell: bash

      - name: Create branch + marker commit
        run: |
          BR="copilot/${TASK_ID}"
          git switch -c "$BR"
          mkdir -p .guidance/state
          echo "$(date -u) • $TASK_TITLE" > ".guidance/state/${TASK_ID}.lock"
          git add ".guidance/state/${TASK_ID}.lock"
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "Start task ${TASK_ID}: ${TASK_TITLE}"
          git push -u origin "$BR"

      - name: Create or find tracking issue
        id: issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const title = `[Task ${process.env.TASK_ID}] ${process.env.TASK_TITLE}`;
            const q = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue in:title "${title}"`
            });
            let issue;
            if (q.data.items.length) {
              issue = q.data.items[0];
            } else {
              const res = await github.rest.issues.create({
                owner, repo, title,
                body: `Automated queue entry for **${process.env.TASK_TITLE}**\n\nTask file: \`${process.env.TASK_PATH}\`\n\n${process.env.TASK_SUMMARY}`,
                labels: ['copilot','queued']
              });
              issue = res.data;
            }
            core.setOutput('number', issue.number);

      - name: Open draft PR to dev
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          title: "[Task ${{ env.TASK_ID }}] ${{ env.TASK_TITLE }}"
          body: |
            Tracking PR for **${{ env.TASK_TITLE }}**
            Task file: `${{ env.TASK_PATH }}`

            This PR gives Copilot a branch/PR to work in. Please keep one task per PR.
          branch: "copilot/${{ env.TASK_ID }}"
          base: dev
          draft: true
          labels: copilot, task

      - name: Mark issue in-progress
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const issue_number = Number("${{ steps.issue.outputs.number }}");
            await github.rest.issues.removeAllLabels({ owner, repo, issue_number }).catch(()=>{});
            await github.rest.issues.addLabels({
              owner, repo, issue_number,
              labels: ['copilot','in-progress']
            });
            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: [
                `Starting **${process.env.TASK_TITLE}**`,
                ``,
                `Branch: \`copilot/${process.env.TASK_ID}\``,
                `PR: ${{ steps.cpr.outputs.pull-request-url }}`
              ].join('\n')
            });

      - name: Discord notify (start)
        if: env.DISCORD_WEBHOOK_URL != ''
        run: |
          MSG="▶️ Starting Task ${TASK_ID}: ${TASK_TITLE}\nPR: ${{ steps.cpr.outputs.pull-request-url }}"
          python - <<'PY' > payload.json
          import json, os; print(json.dumps({"content": os.environ["MSG"]}))
          PY
          curl -sS -X POST -H "Content-Type: application/json" --data-binary @payload.json "$DISCORD_WEBHOOK_URL" || true
