name: Copilot Task Runner (Minimal Orchestrator)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: copilot-merge-queue
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  issues: write

env:
  QUEUE_LABEL: "copilot:todo"
  INPROGRESS_LABEL: "copilot:in-progress"
  WAITING_LABEL: "copilot:waiting"
  MERGE_METHOD: "squash"
  DELETE_BRANCH: "true"

jobs:
  run-queue:
    name: Process PR queue (one at a time)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup gh auth
        run: |
          echo "GH_TOKEN=${{ github.token }}" >> "$GITHUB_ENV"
          gh --version
          jq --version || true

      - name: Select PR (in-progress first, else queued)
        id: select
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          OWNER="${REPO%/*}"
          NAME="${REPO#*/}"

          pick_inprog() {
            gh pr list --state open --label "$INPROGRESS_LABEL" --json number,updatedAt \
              | jq -r 'sort_by(.updatedAt) | .[0].number // empty'
          }
          pick_next() {
            local json
            json="$(gh pr list --state open --label "$QUEUE_LABEL" --json number,updatedAt,labels)"
            jq -r --arg inprog "$INPROGRESS_LABEL" '
              map(select(.labels | map(.name) | index($inprog) | not))
              | sort_by(.updatedAt) | .[0].number // empty
            ' <<<"$json"
          }

          PR="$(pick_inprog)"
          if [[ -z "$PR" ]]; then
            PR="$(pick_next)"
            if [[ -n "$PR" ]]; then
              gh pr edit "$PR" --add-label "$INPROGRESS_LABEL"
              gh pr comment "$PR" --body "🤖 Copilot queue picked this PR. Marked as **in-progress**."
            fi
          fi

          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Stop if nothing to do
        if: steps.select.outputs.pr == ''
        run: echo "Queue empty."

      - name: Process PR
        if: steps.select.outputs.pr != ''
        run: |
          set -euo pipefail
          PR=${{ steps.select.outputs.pr }}
          OWNER="${GITHUB_REPOSITORY%/*}"
          NAME="${GITHUB_REPOSITORY#*/}"

          ms_json="$(gh api graphql -f owner="$OWNER" -f name="$NAME" -F pr="$PR" -f query='
            query($owner:String!,$name:String!,$pr:Int!){
              repository(owner:$owner, name:$name) {
                pullRequest(number:$pr) {
                  state merged isDraft mergeStateStatus headRefOid
                }
              }
            }')"
          state="$(jq -r '.data.repository.pullRequest.state' <<<"$ms_json")"
          merged="$(jq -r '.data.repository.pullRequest.merged' <<<"$ms_json")"
          isDraft="$(jq -r '.data.repository.pullRequest.isDraft' <<<"$ms_json")"
          mergeStateStatus="$(jq -r '.data.repository.pullRequest.mergeStateStatus' <<<"$ms_json")"

          if [[ "$merged" == "true" || "$state" == "CLOSED" ]]; then
            gh pr edit "$PR" --remove-label "$INPROGRESS_LABEL" || true
            gh pr edit "$PR" --remove-label "$WAITING_LABEL" || true
            gh pr edit "$PR" --remove-label "$QUEUE_LABEL" || true
            exit 0
          fi

          if [[ "$mergeStateStatus" != "BLOCKED" && "$isDraft" == "false" ]]; then
            args=( "--${MERGE_METHOD}" )
            [[ "$DELETE_BRANCH" == "true" ]] && args+=( "--delete-branch" )
            gh pr merge "$PR" "${args[@]}"
            gh pr comment "$PR" --body "✅ Merged by Copilot queue."
            gh pr edit "$PR" --remove-label "$INPROGRESS_LABEL" || true
            gh pr edit "$PR" --remove-label "$WAITING_LABEL" || true
            gh pr edit "$PR" --remove-label "$QUEUE_LABEL" || true
            exit 0
          fi

          args=( --auto "--${MERGE_METHOD}" )
          [[ "$DELETE_BRANCH" == "true" ]] && args+=( "--delete-branch" )
          gh pr merge "$PR" "${args[@]}" || true
          gh pr edit "$PR" --add-label "$WAITING_LABEL" || true
