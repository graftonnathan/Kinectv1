name: Process PR queue (one at a time, no labels; no /search API)

on:
  schedule:
    - cron: "*/4 * * * *"         # every 4 minutes
  workflow_dispatch:

concurrency:
  group: copilot-orchestrator
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  COPILOT_HANDLE: "Copilot"       # change if your Copilot reviewer handle differs
  MERGE_METHOD: squash            # squash | merge | rebase
  MAX_WAIT_MINUTES: "45"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Setup gh auth
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "GH_TOKEN=${GH_TOKEN}" >> "$GITHUB_ENV"
          echo "REPO=${{ github.repository }}" >> "$GITHUB_ENV"
          echo "OWNER=${GITHUB_REPOSITORY%/*}" >> "$GITHUB_ENV"
          echo "NAME=${GITHUB_REPOSITORY#*/}"  >> "$GITHUB_ENV"
          gh --version

      # -------- Discover active & next WITHOUT /search API ----------
      - name: Discover active & next PR
        id: choose
        shell: bash
        run: |
          set -euo pipefail

          # Get up to 200 open PRs (oldest first by updatedAt)
          all=$(gh pr list -R "$REPO" --state open --json number,updatedAt -L 200 \
               | jq -c 'sort_by(.updatedAt)')

          # Function: does PR already have Copilot requested?
          has_copilot() {
            local pr="$1"
            local json
            json=$(gh pr view -R "$REPO" "$pr" --json reviewRequests 2>/dev/null || echo '{}')
            jq -e --arg u "${{ env.COPILOT_HANDLE }}" \
               'any(.reviewRequests[].login?; . == $u)' <<<"$json" >/dev/null
          }

          active=""
          pick=""

          # First pass: find oldest PR where Copilot IS already requested
          for pr in $(jq -r '.[].number' <<<"$all"); do
            if has_copilot "$pr"; then
              active="$pr"
              break
            fi
          done

          # Second pass: if none active, pick oldest PR WITHOUT Copilot requested
          if [[ -z "$active" ]]; then
            for pr in $(jq -r '.[].number' <<<"$all"); do
              if ! has_copilot "$pr"; then
                pick="$pr"
                break
              fi
            done
          fi

          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "pick=$pick"     >> "$GITHUB_OUTPUT"

      - name: Enforce single active (remove Copilot from extras)
        if: ${{ steps.choose.outputs.active != '' }}
        shell: bash
        run: |
          set -euo pipefail
          act="${{ steps.choose.outputs.active }}"
          # Find all PRs with Copilot requested
          all=$(gh pr list -R "$REPO" --state open --json number -L 200 | jq -r '.[].number')
          for n in $all; do
            if [[ "$n" == "$act" ]]; then continue; fi
            json=$(gh pr view -R "$REPO" "$n" --json reviewRequests 2>/dev/null || echo '{}')
            if jq -e --arg u "${{ env.COPILOT_HANDLE }}" 'any(.reviewRequests[].login?; . == $u)' <<<"$json" >/dev/null; then
              gh pr edit -R "$REPO" "$n" --remove-reviewer "${{ env.COPILOT_HANDLE }}" || true
              gh pr comment -R "$REPO" "$n" --body "⏸️ Copilot is busy with PR #$act; review request removed for now."
            fi
          done

      - name: Request Copilot on picked PR
        if: ${{ steps.choose.outputs.active == '' && steps.choose.outputs.pick != '' }}
        shell: bash
        run: |
          PR="${{ steps.choose.outputs.pick }}"
          echo "Requesting Copilot review on PR #$PR"
          gh pr edit -R "$REPO" "$PR" --add-reviewer "${{ env.COPILOT_HANDLE }}" || true
          gh pr comment -R "$REPO" "$PR" --body "🤖 Queued for **${{ env.COPILOT_HANDLE }}**."

      - name: Stop if nothing to do
        if: ${{ steps.choose.outputs.active == '' && steps.choose.outputs.pick == '' }}
        run: echo "Queue empty."

      - name: Determine active PR number
        id: focus
        run: |
          echo "pr=${{ steps.choose.outputs.active || steps.choose.outputs.pick }}" >> "$GITHUB_OUTPUT"

      - name: Prepare active PR (ready + clean WIP/Draft)
        if: ${{ steps.focus.outputs.pr != '' }}
        shell: bash
        run: |
          PR="${{ steps.focus.outputs.pr }}"
          gh pr ready -R "$REPO" "$PR" || true
          TITLE=$(gh pr view -R "$REPO" "$PR" --json title -q .title)
          CLEAN=$(printf "%s" "$TITLE" \
            | sed -E 's/^[[:space:]]*\[?[Ww][Ii][Pp]\]?[[:space:]]*[:\-]*[[:space:]]*//' \
            | sed -E 's/^[[:space:]]*\[?[Dd]raft\]?[[:space:]]*[:\-]*[[:space:]]*//')
          if [ "$CLEAN" != "$TITLE" ] && [ -n "$CLEAN" ]; then
            gh pr edit -R "$REPO" "$PR" --title "$CLEAN"
          fi

      - name: Approve (counts with PAT; falls back to GITHUB_TOKEN)
        if: ${{ steps.focus.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.focus.outputs.pr }}"
          gh pr review -R "$REPO" "$PR" --approve -b "Auto-approved by orchestrator"

      - name: Wait for checks to pass, then merge
        if: ${{ steps.focus.outputs.pr != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR="${{ steps.focus.outputs.pr }}"
          limit=$(( ${{ env.MAX_WAIT_MINUTES }} * 60 ))
          interval=30
          elapsed=0
          echo "Waiting up to $limit seconds for checks on PR #$PR…"

          while (( elapsed < limit )); do
            pr_json=$(gh api graphql -f owner="$OWNER" -f name="$NAME" -F pr="$PR" -f query='
              query($owner:String!,$name:String!,$pr:Int!){
                repository(owner:$owner,name:$name){
                  pullRequest(number:$pr){
                    isDraft
                    mergeStateStatus
                    headRefOid
                  }
                }
              }')
            isDraft=$(jq -r '.data.repository.pullRequest.isDraft' <<<"$pr_json")
            mergeState=$(jq -r '.data.repository.pullRequest.mergeStateStatus' <<<"$pr_json")
            sha=$(jq -r '.data.repository.pullRequest.headRefOid' <<<"$pr_json")

            rollup=$(gh api graphql -f owner="$OWNER" -f name="$NAME" -F sha="$sha" -f query='
              query($owner:String!,$name:String!,$sha:GitObjectID!){
                repository(owner:$owner,name:$name){
                  object(oid:$sha){ ... on Commit { statusCheckRollup { state } } }
                }
              }')
            state=$(jq -r '.data.repository.object.statusCheckRollup.state // "PENDING"' <<<"$rollup")

            echo "state=$state mergeState=$mergeState draft=$isDraft elapsed=${elapsed}s"
            if [[ "$isDraft" == "false" && "$state" == "SUCCESS" && "$mergeState" != "BLOCKED" ]]; then
              gh pr merge -R "$REPO" "$PR" --${{ env.MERGE_METHOD }} --delete-branch
              echo "Merged PR #$PR"
              exit 0
            fi
            sleep "$interval"
            elapsed=$(( elapsed + interval ))
          done

          echo "Checks not green in time; leaving PR #$PR open."

            elapsed=$(( elapsed + interval ))
          done

          echo "Checks not green in time; leaving PR #$PR open."
