name: Auto-approve waiting workflow runs

on:
  schedule:
    - cron: "*/2 * * * *"   # every 2 minutes
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Approve same-repo runs that are waiting
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.WORKFLOW_APPROVER_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            // Get last 50 runs; filter by status "action_required" (waiting for approval)
            const res = await github.request('GET /repos/{owner}/{repo}/actions/runs', {
              owner, repo, per_page: 50
            });
            let approved = 0;
            for (const run of res.data.workflow_runs) {
              // Only approve "action_required" for PRs from same repo (not forks)
              if (run.status !== 'action_required') continue;
              if (run.event !== 'pull_request') continue;
              if (!run.head_repository || run.head_repository.full_name !== `${owner}/${repo}`) continue;

              try {
                await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/approve', {
                  owner, repo, run_id: run.id
                });
                approved++;
              } catch (e) {
                core.warning(`Approve failed for ${run.id}: ${e.message}`);
              }
            }
            core.notice(`Approved ${approved} run(s).`);
