name: Label Copilot PR when CI is green

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
    branches: [dev]
  check_suite:
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  mark-ready:
    runs-on: ubuntu-latest
    steps:
      - name: Label PRs when all checks are green
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

