            async function getCandidatePRs() {
              if (context.eventName === 'pull_request') {
                return [context.payload.pull_request];
              }
              if (context.eventName === 'check_suite' &&
                  context.payload.check_suite &&
                  context.payload.check_suite.conclusion === 'success') {
                const sha = context.payload.check_suite.head_sha;
                const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha });
                return prs.data;
              }
