name: Copilot – gate + runner

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write

# Ensure only one Copilot worker runs at a time
concurrency:
  group: copilot/worker
  cancel-in-progress: false

jobs:
  gatekeeper:
    name: Gatekeeper – choose exactly one PR
    runs-on: ubuntu-latest
    outputs:
      in_progress_pr: ${{ steps.pick.outputs.in_progress_pr }}
    steps:
      - name: Pick PR targeting dev
        id: pick
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // core, github, context are injected; don't require() them
            const INPROG = 'copilot:in-progress';
            const QUEUED = 'copilot:queued';
            const BASE = 'dev';
            const { owner, repo } = context.repo;

            const prs = await github.paginate(
              github.rest.pulls.list, { owner, repo, state: 'open', base: BASE, per_page: 100 }
            );

            const getLabels = (pr) => pr.labels.map(l => typeof l === 'string' ? l : l.name);
            let inProg = prs.find(pr => getLabels(pr).includes(INPROG));

            if (!inProg && prs.length) {
              inProg = prs[0]; // most recently updated (default ordering)
              core.info(`Setting PR #${inProg.number} as ${INPROG}`);
              await github.rest.issues.addLabels({
                owner, repo, issue_number: inProg.number, labels: [INPROG]
              });
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: inProg.number, name: QUEUED
                });
              } catch {}
            }

            for (const pr of prs) {
              if (inProg && pr.number === inProg.number) continue;
              const labels = getLabels(pr);
              if (!labels.includes(QUEUED)) {
                core.info(`Queuing PR #${pr.number}`);
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: pr.number, labels: [QUEUED]
                });
              }
              if (labels.includes(INPROG)) {
                try {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: pr.number, name: INPROG
                  });
                } catch {}
              }
            }

            core.setOutput('in_progress_pr', inProg ? String(inProg.number) : '');
            core.info(`Gatekeeper selected: ${inProg ? '#' + inProg.number : 'none'}`);

  worker:
    name: Copilot worker
    needs: gatekeeper
    if: needs.gatekeeper.outputs.in_progress_pr != ''
    runs-on: ubuntu-latest

    steps:
      - name: Show chosen PR
        run: echo "Working on PR #${{ needs.gatekeeper.outputs.in_progress_pr }}"

      - uses: actions/checkout@v4
        with:
          # Check out the PR's merge ref so you can build/test
          ref: refs/pull/${{ needs.gatekeeper.outputs.in_progress_pr }}/merge
          fetch-depth: 0

      # --- Your Copilot/automation steps go here ---
      # Example: call your existing scripts, tools, etc.
      - name: Run Copilot dispatcher
        run: |
          echo "Dispatching Copilot against PR #${{ needs.gatekeeper.outputs.in_progress_pr }}"
          # ./scripts/copilot-dispatch.sh ${{ needs.gatekeeper.outputs.in_progress_pr }}

      # (Optional) mark queued → in-progress artifacts, notify Discord, etc.
