name: Copilot Dispatcher

on:
  pull_request:
    branches: [dev]
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled, closed]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  gatekeeper:
    name: Gatekeeper (one Copilot PR at a time)
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Decide queue status
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const core = require('@actions/core');
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setOutput('proceed','false');
              return;
            }
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const prNumber = pr.number;

            const IN_PROGRESS = 'copilot:in-progress';
            const QUEUED      = 'copilot:queued';

            // helper: ensure a label exists on repo
            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch {
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }

            await ensureLabel(IN_PROGRESS, '0e8a16', 'Currently being processed by Copilot automation');
            await ensureLabel(QUEUED,      'c2e0c6', 'Waiting turn for Copilot automation');

            // List open PRs labeled "in-progress"
            const { data: inProg } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:open is:pr label:"${IN_PROGRESS}"`
            });

            const someoneElseInProgress = inProg.items.some(i => i.number !== prNumber);

            if (someoneElseInProgress) {
              // Mark this PR as queued and skip
              await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: [QUEUED] });
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber,
                body: `⏳ Another PR is marked **${IN_PROGRESS}**. This PR is **queued** and will run when the current one finishes.`
              });
              core.setOutput('proceed','false');
              return;
            }

            // We can proceed. Make this PR "in-progress".
            // Remove "queued" if present, add "in-progress" if missing.
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number: prNumber });
            const names = labels.map(l => l.name);
            if (names.includes(QUEUED)) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name: QUEUED }).catch(() => {});
            }
            if (!names.includes(IN_PROGRESS)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: [IN_PROGRESS] });
            }

            core.setOutput('proceed','true');

  run-copilot:
    name: Run Copilot worker
    needs: [gatekeeper]
    if: ${{ needs.gatekeeper.outputs.proceed == 'true' }}
    # Double-guard: never run more than one across the repo at a time.
    concurrency:
      group: copilot-queue
      cancel-in-progress: false
    uses: ./.github/workflows/copilot-task-runner.yml
    with:
      task: "auto"
    secrets: inherit

  tidy-labels:
    name: Tidy labels on close/merge
    if: ${{ github.event.action == 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const pr = context.payload.pull_request;
            if (!pr) return;

            const IN_PROGRESS = 'copilot:in-progress';
            const QUEUED      = 'copilot:queued';

            // Remove labels from the closed PR
            for (const name of [IN_PROGRESS, QUEUED]) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name });
              } catch {}
            }

            // Optional: nudge queued PRs with a comment so maintainers see what's next.
            const { data: queued } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:open is:pr label:"${QUEUED}" sort:created-asc`
            });
            if (queued.items.length) {
              const next = queued.items[0];
              await github.rest.issues.createComment({
                owner, repo, issue_number: next.number,
                body: `✅ A previously active PR just closed. You are next in queue for Copilot automation. Push a new commit or reopen to trigger the dispatcher.`
              });
            }
