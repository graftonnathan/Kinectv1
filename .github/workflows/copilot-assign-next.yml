name: Copilot Assign Next (no labels)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: copilot-assign-next
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  assign-next:
    runs-on: ubuntu-latest
    env:
      COPILOT_HANDLE: Copilot
    steps:
      - name: Auth gh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "GH_TOKEN=${GH_TOKEN}" >> "$GITHUB_ENV"
          echo "REPO=${{ github.repository }}" >> "$GITHUB_ENV"
          gh --version

      - name: Exit if Copilot is already assigned to any open PR
        id: busy
        run: |
          set -euo pipefail
          BUSY=$(gh pr list -R "$REPO" --state open --json number,assignees \
                 | jq --arg u "${{ env.COPILOT_HANDLE }}" \
                      '[.[] | select([.assignees[].login?] | index($u))] | length')
          echo "busy=$BUSY" >> "$GITHUB_OUTPUT"

      - name: Find oldest eligible PR (authored by Copilot)
        if: steps.busy.outputs.busy == '0'
        id: by_author
        run: |
          set -euo pipefail
          PR=$(gh pr list -R "$REPO" --state open --json number,author,isDraft,assignees,updatedAt \
               | jq -r --arg u "${{ env.COPILOT_HANDLE }}" '
                    map(select(.isDraft | not))
                    | map(select([.assignees[].login?] | index($u) | not))
                    | map(select(.author.login == $u))
                    | sort_by(.updatedAt)
                    | .[0].number // empty')
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: If none by Copilot, find oldest unassigned PR
        if: steps.busy.outputs.busy == '0' && steps.by_author.outputs.pr == ''
        id: unassigned
        run: |
          set -euo pipefail
          PR=$(gh pr list -R "$REPO" --state open --json number,isDraft,assignees,updatedAt \
               | jq -r '
                    map(select(.isDraft | not))
                    | map(select(.assignees | length == 0))
                    | sort_by(.updatedAt)
                    | .[0].number // empty')
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Assign Copilot to chosen PR
        if: steps.busy.outputs.busy == '0' && (steps.by_author.outputs.pr != '' || steps.unassigned.outputs.pr != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHOSEN="${{ steps.by_author.outputs.pr }}"
          if [ -z "$CHOSEN" ]; then CHOSEN="${{ steps.unassigned.outputs.pr }}"; fi
          echo "Assigning Copilot to PR #$CHOSEN"
          gh pr edit -R "$REPO" "$CHOSEN" --add-assignee "${{ env.COPILOT_HANDLE }}" || true
          gh pr comment -R "$REPO" "$CHOSEN" --body "🤖 Assigning to **${{ env.COPILOT_HANDLE }}** (auto)."

      - name: Nothing to assign
        if: steps.busy.outputs.busy == '0' && (steps.by_author.outputs.pr == '' && steps.unassigned.outputs.pr == '')
        run: echo "No eligible PRs to assign."
