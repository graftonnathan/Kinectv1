name: Copilot Assign Next (request reviewer, no labels)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: copilot-assign-next
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  assign-next:
    runs-on: ubuntu-latest
    env:
      COPILOT_HANDLE: Copilot   # change if your Copilot login differs
    steps:
      - name: Auth gh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "GH_TOKEN=${GH_TOKEN}" >> "$GITHUB_ENV"
          echo "REPO=${{ github.repository }}" >> "$GITHUB_ENV"
          gh --version

      - name: Exit if Copilot already requested anywhere
        id: busy
        run: |
          set -euo pipefail
          BUSY=$(gh pr list -R "$REPO" --search "is:open review-requested:${{ env.COPILOT_HANDLE }}" -L 100 \
                 --json number | jq 'length')
          echo "busy=$BUSY" >> "$GITHUB_OUTPUT"

      - name: Pick oldest PR without Copilot as reviewer
        if: ${{ steps.busy.outputs.busy == '0' }}
        id: pick
        run: |
          set -euo pipefail
          PR=$(gh pr list -R "$REPO" --search "is:open -review-requested:${{ env.COPILOT_HANDLE }}" -L 100 \
               --json number,updatedAt | jq -r 'sort_by(.updatedAt) | .[0].number // empty')
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Request review from Copilot
        if: ${{ steps.busy.outputs.busy == '0' && steps.pick.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.pick.outputs.pr }}"
          echo "Requesting review from ${{ env.COPILOT_HANDLE }} on PR #$PR"
          gh pr edit -R "$REPO" "$PR" --add-reviewer "${{ env.COPILOT_HANDLE }}" || true
          gh pr comment -R "$REPO" "$PR" --body "🤖 Requested review from **${{ env.COPILOT_HANDLE }}** (auto)."

      - name: Nothing to assign
        if: ${{ steps.busy.outputs.busy == '0' && steps.pick.outputs.pr == '' }}
        run: echo "No eligible PRs (all open PRs already requested Copilot)."


      - name: Nothing to assign
        if: ${{ steps.busy.outputs.busy == '0' && steps.pick.outputs.pr == '' }}
        run: echo "No eligible PRs to assign (all open PRs already have Copilot assigned)."

