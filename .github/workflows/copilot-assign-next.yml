name: Copilot Assign Next (broad, no labels)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: copilot-assign-next
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  assign-next:
    runs-on: ubuntu-latest
    env:
      COPILOT_HANDLE: Copilot   # change if your Copilot assignee login differs
    steps:
      - name: Auth gh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "GH_TOKEN=${GH_TOKEN}" >> "$GITHUB_ENV"
          echo "REPO=${{ github.repository }}" >> "$GITHUB_ENV"
          gh --version

      - name: Exit if Copilot is already assigned to any open PR
        id: busy
        run: |
          set -euo pipefail
          BUSY=$(gh pr list -R "$REPO" --state open --json number,assignees -L 1000 \
                 | jq --arg u "${{ env.COPILOT_HANDLE }}" \
                      '[.[] | select([.assignees[].login?] | index($u))] | length')
          echo "busy=$BUSY" >> "$GITHUB_OUTPUT"

      # Pick the oldest open PR where Copilot is NOT an assignee (drafts allowed)
      - name: Find oldest eligible PR
        if: ${{ steps.busy.outputs.busy == '0' }}
        id: pick
        run: |
          set -euo pipefail
          PR=$(gh pr list -R "$REPO" --state open --json number,assignees,updatedAt,isDraft -L 1000 \
               | jq -r --arg u "${{ env.COPILOT_HANDLE }}" '
                    map(select(.assignees | map(.login) | index($u) | not))
                    | sort_by(.updatedAt)
                    | .[0].number // empty')
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Assign Copilot to chosen PR
        if: ${{ steps.busy.outputs.busy == '0' && steps.pick.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.pick.outputs.pr }}"
          echo "Assigning ${{ env.COPILOT_HANDLE }} to PR #$PR"
          gh pr edit -R "$REPO" "$PR" --add-assignee "${{ env.COPILOT_HANDLE }}" || true
          gh pr comment -R "$REPO" "$PR" --body "🤖 Assigning to **${{ env.COPILOT_HANDLE }}** (auto)."

      - name: Nothing to assign
        if: ${{ steps.busy.outputs.busy == '0' && steps.pick.outputs.pr == '' }}
        run: echo "No eligible PRs to assign (all open PRs already have Copilot assigned)."

