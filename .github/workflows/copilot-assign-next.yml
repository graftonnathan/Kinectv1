name: Copilot Assign Next (no label queue)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  pull_request:
    types: [closed]

concurrency:
  group: copilot-assign-next
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  assign:
    runs-on: ubuntu-latest
    env:
      COPILOT_HANDLE: Copilot
    steps:
      - name: Auth gh
        run: echo "GH_TOKEN=${{ github.token }}" >> "$GITHUB_ENV"

      - name: Skip if Copilot already has an assigned PR
        id: busy
        run: |
          set -euo pipefail
          BUSY=$(gh pr list --state open --json number,assignees                  | jq --arg u "${{ env.COPILOT_HANDLE }}"                     '[.[] | select([.assignees[].login?] | index($u))] | length')
          echo "busy=$BUSY" >> "$GITHUB_OUTPUT"

      - name: Assign oldest Copilot-authored unassigned PR
        if: ${{ steps.busy.outputs.busy == '0' }}
        run: |
          set -euo pipefail
          # Look for PRs created by Copilot where Copilot is not currently assigned
          PR=$(gh pr list --state open --json number,updatedAt,isDraft,author,assignees                | jq -r --arg u "${{ env.COPILOT_HANDLE }}" '
                   map(select(.author.login == $u))
                   | map(select(.isDraft | not))
                   | map(select([.assignees[].login?] | index($u) | not))
                   | sort_by(.updatedAt)
                   | .[0].number // empty')
          if [[ -z "$PR" ]]; then
            echo "No Copilot-authored PRs ready for assignment."
            exit 0
          fi
          gh pr edit "$PR" --add-assignee "${{ env.COPILOT_HANDLE }}" || true
          gh pr comment "$PR" --body "🤖 Assigning to **${{ env.COPILOT_HANDLE }}** (no-label queue)."
