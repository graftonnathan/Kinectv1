name: "Resilience: explicit backpressure for audio/LLM pipelines"
goal: >
  Make audio and LLM pipelines bounded with clear drop policies and proper cancellation
  so bursts cannot build unbounded tails (CPU/memory spikes).

context:
  repo_paths:
    - VoiceRecognizer.cs
    - DiscordSystemAudioCapture.cs
    - DiscordNetBotManager.cs
    - DiscordAudioProcessor.cs
    - KokoroTtsService.cs
    - CoquiTtsService.cs
    - OllamaService.cs
  constraints:
    - Use BlockingCollection<T> with bounded capacity or a custom RingBuffer<T>.
    - No blocking on UI thread; propagate CancellationToken end-to-end.
    - Add Telemetry counters for enqueues, dequeues, drops, and max_depth.

steps:
  - Introduce BoundedQueue<T> (BoundedQueue.cs):
      - ctor(capacity, DropPolicy {DropOldest|DropNewest|Block})
      - TryEnqueue(T, out dropped) and TryDequeue(out T)
      - Depth property and MaxDepth tracking (for Telemetry).
  - Audio input path:
      - In DiscordSystemAudioCapture and VoiceRecognizer, route raw audio frames into BoundedQueue<float[]> with capacity tuned (e.g., 50 x 20ms frames).
      - On overflow: DropOldest; increment Telemetry drop counters.
  - ASR path:
      - VoiceProcessor consumes frames from queue in a dedicated worker task that observes the app CancellationToken.
  - TTS path:
      - Queue Speak requests (utterances) with small capacity (e.g., 3). New utterance drops oldest or cancels it via CTS (configurable policy).
  - Ollama path:
      - Guard TryDispatchToOllama with a small bounded queue of prompts; drop duplicates; cancel stale entries if disabled.
  - Ensure all long-running loops accept a CancellationToken and stop quickly on shutdown.

acceptance_criteria:
  - Under input bursts, depth stabilizes and Telemetry shows non-growing tails.
  - No hangs on shutdown; all workers exit within 2s after cancellation.
  - Clear logs when drops occur (single-line JSON via Telemetry).
  - UI responsive during stress (no blocking on Dispatcher).

files_touched:
  - add: BoundedQueue.cs
  - modify: VoiceRecognizer.cs, VoiceProcessor.cs, DiscordSystemAudioCapture.cs, DiscordAudioProcessor.cs, CoquiTtsService.cs, KokoroTtsService.cs, OllamaService.cs

labels: [resilience, backpressure, cancellation]
