task: 0025 - Profile hotspots; pool allocations in hot paths
why:
  symptoms:
    - "Per-chunk allocations and LINQ in audio/STT loops; ONNX session creation costs."
  diagnosis: >
    Replace transient allocations with ArrayPool; avoid LINQ; precreate ONNX sessions where safe; reuse buffers.
scope:
  repo: graftonnathan/Kinectv1
  branch: dev
changes:
  - "AudioUtils/VoiceProcessor: ArrayPool<T> for frame buffers; for-loops over LINQ."
  - "SpeakerEmbedder: reuse input tensor; pin buffers as needed."
  - "OnnxSessionFactory: warm pool at startup; reuse sessions; expose meter."
acceptance:
  - "GC Gen0 rate reduced in a 60s run; CPU and latency improved."
telemetry:
  - "counter.gc.gen0/sec (approx)"
  - "timer.audio.frame.process.ms"
