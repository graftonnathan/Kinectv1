task: 0012 - Enforce Discord voice-channel ingest & disable system loopback when Discord input is enabled
why:
  symptoms:
    - "DiscordSystemAudioCapture starts: 'System loopback capture started (default output)' even when Discord input is enabled."
    - "Echo/feedback into ASR; duplicates and unintended triggers."
  diagnosis: >
    The UI 'Discord input' toggle or scenario wiring starts the system loopback service. For Discord ingest, only the voice
    receive pipeline (Opus→PCM from the joined voice channel) should run. Loopback must remain disabled.
scope:
  repo: graftonnathan/Kinectv1
  branch: dev
changes:
  - "MainWindow.xaml.cs / HostedServicesManager.cs: start either DiscordSystemAudioCapture OR Discord voice receiver, never both."
  - "DiscordSystemAudioCapture.cs: add explicit Scenario/Mode guard so it cannot start when Discord Voice Ingest is active."
  - "AppSettings.cs: introduce 'AudioIn.Mode' enum: LocalMic|DiscordVoice|SystemLoopback; bind the UI toggle to this value."
  - "Diagnostics: log the selected ingest mode at startup."
steps:
  - "Add AudioInMode enum and getters/setters in AppSettings; default to LocalMic."
  - "Wire the UI toggle(s) to set AudioInMode=DiscordVoice when Discord input is enabled."
  - "In service registration, condition on AudioInMode: start VoiceReceiver for DiscordVoice; start SystemAudio for SystemLoopback only."
  - "Ensure 'Discord input enabled' no longer maps to loopback service."
acceptance:
  - "On launch with Discord input enabled: NO 'System loopback capture started' log appears."
  - "Only one ingest pipeline active at a time; diagnostics shows: 'Input: Discord Voice (Opus→PCM)'."
  - "ASR no longer reacts to local speaker output with identical phrases within 10s window."
telemetry:
  - "counter.audio.ingest.mode: {local_mic,discord_voice,system_loopback}"
  - "gauge.audio.ingest.active=1 when running; 0 otherwise"
