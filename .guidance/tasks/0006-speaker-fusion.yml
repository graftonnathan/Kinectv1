name: "Identity: time-decayed voice+face fusion tracker"
goal: >
  Replace ad-hoc speaker fallback with a scored, time-decayed fusion of voice and face
  to stabilize identity across brief gaps.

context:
  repo_paths:
    - EnhancedKinectFaceTracker.cs
    - SpeakerIdentifier.cs
    - VoiceRecognizer.cs
    - MainWindow.xaml.cs
    - MemoryStore.cs
  constraints:
    - No heavy ML; just a scoring model with decay and simple data association.
    - Track by Kinect TrackingId and recent voice embedding matches.
    - Tunables in AppSettings (fusion weights, decay half-life ms).

steps:
  - Add IdentityFusionTracker.cs:
      - Track: {trackId, faceName?, faceScore, voiceName?, voiceScore, fusedName, fusedScore, lastUpdate}.
      - UpdateFace(trackId, name, conf), UpdateVoice(trackId?, name, conf).
      - Time decay: score *= exp(-dt/halfLife).
      - Fusion: weighted sum (w_face, w_voice) with threshold for “Unknown”.
  - Wire updates:
      - EnhancedKinectFaceTracker: on each face tick call UpdateFace(TrackingId,...).
      - When VoiceRecognizer emits a speaker match near a face (spatial/temporal proximity heuristic),
        call UpdateVoice for that track; if no proximity, keep voice-only association briefly.
  - MainWindow: display fused identity & score; remove ad-hoc UI coloring based solely on single conf.
  - AppSettings: Fusion weights and half-life getters/setters + summary.

acceptance_criteria:
  - Name stays stable across 1–2s gaps when either voice or face temporarily drops.
  - “Unknown” only when both modalities are low/decayed.
  - Console/UI logs show fusedName with a sensible score progression.

files_touched:
  - add: IdentityFusionTracker.cs
  - modify: EnhancedKinectFaceTracker.cs, SpeakerIdentifier.cs, VoiceRecognizer.cs, MainWindow.xaml.cs, AppSettings.cs

labels: [identity, fusion, kinect, speaker]
