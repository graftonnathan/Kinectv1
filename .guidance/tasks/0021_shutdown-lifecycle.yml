task: 0021 - Reliable shutdown: cancel tokens, stop services, kill stragglers
why:
  symptoms:
    - "Application will not close from GUI; hangs."
  diagnosis: >
    Some services (Discord audio, eSpeak worker, capture loops) ignore cancellation or await indefinitely.
    Centralize cancellation and enforce time-bounded StopAsync.
scope:
  repo: graftonnathan/Kinectv1
  branch: dev
changes:
  - "HostedServicesManager: one CancellationTokenSource; StopAsync calls each service with a 2s timeout, then hard-stop."
  - "eSpeak worker: send quit signal; if not down in 500ms, kill process tree."
  - "DiscordBot: DisconnectAsync with timeout; ignore late events post-stop."
  - "MainWindow.OnClosing: await StopAsync with UI spinner; then Environment.Exit(0) as last resort."
acceptance:
  - "App closes within 3s from GUI under load."
  - "No orphaned espeak-ng.exe or audio capture processes remain."
telemetry:
  - "timer.app.stop.ms"
  - "counter.app.stop.forced_kill"
