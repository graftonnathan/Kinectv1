name: "Error taxonomy: normalized categories + user hints"
goal: >
  Normalize error reporting into categories with user-actionable hints so UI and logs
  are consistent and helpful.

context:
  repo_paths:
    - AppSettings.cs
    - OnnxSessionFactory.cs
    - DiscordNativeLoader.cs
    - DiscordNetBotManager.cs
    - KokoroTtsService.cs
    - CoquiTtsService.cs
    - VoiceRecognizer.cs
    - MainWindow.xaml.cs
  constraints:
    - No external deps. Keep messages short; attach hint strings.

steps:
  - Add AppError.cs:
      - enum AppErrorCategory { Config, IO, Audio, Network, GPU, ASR, TTS, Discord, Unknown }
      - record AppError(category, code, message, hint=null, ex=null)
      - static helpers: FromException(...)
  - Telemetry.Event("error", {category, code, message, hint}) on creation.
  - Update key catch blocks to wrap into AppError with appropriate hints, e.g.:
      - GPU provider missing -> hint: "Install CUDA EP runtime or switch to CPU in Settings."
      - Discord token invalid -> hint: "Check DiscordBotToken in settings."
      - Model file missing -> hint: "Verify model path on Diagnostics page."
  - MainWindow: surface concise toast/banner using category color mapping.

acceptance_criteria:
  - Errors log once as structured "error" events with category/code/hint.
  - UI shows a single concise line + optional "details" expander.
  - At least 6 representative sites converted to AppError.

files_touched:
  - add: AppError.cs
  - modify: OnnxSessionFactory.cs, DiscordNativeLoader.cs, DiscordNetBotManager.cs,
            KokoroTtsService.cs, CoquiTtsService.cs, VoiceRecognizer.cs, MainWindow.xaml.cs, AppSettings.cs

labels: [errors, ux, logging]
