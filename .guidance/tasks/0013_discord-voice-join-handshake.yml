task: 0013 - Stabilize Discord voice join (handle 4006 'Session is no longer valid')
why:
  symptoms:
    - "Repeated: WebSocket close 4006 during AudioClient identify."
    - "Join attempts loop; 'Session is no longer valid' immediately after Sent Identify."
  diagnosis: >
    The audio connect is racing before both VOICE_STATE_UPDATE (w/ sessionId) and VOICE_SERVER_UPDATE (w/ token, endpoint) arrive,
    or reusing a stale session/token between attempts. Need a handshake state machine and a clean retry path.
scope:
  repo: graftonnathan/Kinectv1
  branch: dev
changes:
  - "DiscordNetBotManager.cs: implement JoinVoiceAsync state machine: wait for BOTH signals, then connect."
  - "Cache sessionId/token per guild; invalidate on 4006; exponential backoff (e.g., 0.5s→2s) with max 3 tries."
  - "Do not call ConnectAsync twice; hold a per-guild async lock; clear previous audio client before retry."
  - "Improve logging: record timing of VSU/VSR events and payloads (masked)."
steps:
  - "Create a TaskCompletionSource for sessionId and one for server token/endpoint; set with timeouts."
  - "On join, await Task.WhenAll(tcsSession, tcsServer) before ConnectAsync."
  - "On WebSocketClosedException 4006: dispose client, clear tcs, backoff, re-request join (fresh VSU/VSR)."
  - "Ensure GLOBAL VOICE LOCK covers the entire handshake sequence."
acceptance:
  - "Join succeeds within 1–2 attempts; no infinite 4006 loops."
  - "Logs show 'Handshake: got Session + Server in Xms' prior to ConnectAsync."
  - "Leave/Join cycle works repeatedly without lingering sessionIds."
telemetry:
  - "timer.discord.voice.join.ms"
  - "counter.discord.voice.join.4006"
  - "gauge.discord.voice.connected {0|1}"
