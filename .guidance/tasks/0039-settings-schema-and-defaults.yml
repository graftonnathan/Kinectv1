# Copilot Agent Task
version: 1
name: "Define strongly-typed settings schema + defaults"
goal: |
  Introduce a versioned, strongly-typed settings model that can be serialized to JSON and supports migration.
  Include: app paths, audio device selections (input/output), model file paths, logging level, and feature toggles.

context:
  repo_paths:
    - ./

tasks:
  - Add `/src/Config/AppSettings.cs` (POCO) with annotations.
  - Include `SettingsVersion` and `LastUpdated`.
  - Provide `/src/Config/Defaults.cs` with safe defaults.
  - Add `ISettingsProvider` + `JsonSettingsProvider`.
  - Add migration helper `SettingsMigrations.cs`.

acceptance_criteria:
  - `AppSettings` compiles and serializes/deserializes cleanly.
  - Defaults are used when file missing/corrupt.
  - Version migration is unit-tested.
