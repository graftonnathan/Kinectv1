task: 0015 - Replace naive decimation with quality resampler + pre-decimation LPF
why:
  symptoms:
    - "Repeated warnings: 'Discord audio chunk too large: 5760 (max: 1920)'."
    - "ASR instability / intelligibility issues."
  diagnosis: >
    Chunks at 48k (2ch) must be resampled/mixed to 16k mono and framed to 20ms (320 samples).
    Use a proper resampler (NAudio.WdlResamplingSampleProvider) or custom FIR + ring buffer.
scope:
  repo: graftonnathan/Kinectv1
  branch: dev
changes:
  - "AudioUtils.cs: add Resample48kTo16kMono(in: float[]/short[]) with LPF (cutoff ~7kHz)."
  - "FrameBuilder: accumulate into 320-sample mono frames; drop/trim excess with metrics."
  - "Replace LINQ-heavy code with pooled buffers (ArrayPool<T>)."
steps:
  - "Introduce AudioBufferPool for short/float arrays."
  - "Unit test: feed 1s 48k sine/chirp → expect exact 16k samples count; no drift."
  - "Remove 'chunk too large' logs in steady state."
acceptance:
  - "No 'chunk too large' messages during 60s capture."
  - "Latency mic/discord→ASR < 120ms median."
telemetry:
  - "timer.audio.resample.ms"
  - "counter.audio.frame.dropped"
