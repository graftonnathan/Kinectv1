# Copilot Agent Task
version: 1
name: "Design plan for Settings UI (tree left, editor right)"
goal: |
  Create a concise UX plan for a Settings window suitable for a WPF desktop app:
  - Left: hierarchical TreeView categories (General, Audio, Paths, Models, Discord, Advanced).
  - Right: detail panel that renders the selected category’s editor (data-bound forms).
  - Include Apply / Save, Cancel, and Restore Defaults behaviors with dirty-state prompts.

context:
  repo_paths:
    - ./

tasks:
  - Deliver a short markdown doc `/docs/settings/ux-plan.md` with the layout, states, and navigation flows.
  - Define the categories and representative fields (paths, audio devices, model toggles, etc.).
  - Specify keyboard navigation and minimum accessibility (tab order, labels for screen readers).

acceptance_criteria:
  - UX plan doc exists and is readable.
  - Categories and key fields are enumerated.
  - Includes dirty-state, cancel, defaults, and accessibility notes.
