task: 0014 - Implement Discord voice-channel receiver → 16k mono pipeline
why:
  symptoms:
    - "ASR is fed from loopback instead of voice channel."
  diagnosis: >
    Need a proper Discord voice receive path: Opus→PCM (48k stereo) → resample & mono → 16k 20ms frames for ASR.
scope:
  repo: graftonnathan/Kinectv1
  branch: dev
changes:
  - "Add DiscordVoiceReceiver service: subscribes to Discord.Net voice receive (if library supports) or FFmpeg/Opus decoder."
  - "Resample with quality (WDL or custom FIR) to 16k; channel mix to mono; frame into 320-sample chunks (20ms)."
  - "Push frames to VoiceProcessor via bounded channel."
  - "Remove/disable DiscordSystemAudioCapture for Discord mode."
steps:
  - "Create IAudioInSource abstraction (Mic, DiscordVoice, Loopback) → common PCM16 mono 16k stream."
  - "Wire into VoiceRecognizer/VoiceProcessor."
  - "Add health logs: 'Discord voice frames rx: N/s'."
acceptance:
  - "When joined to voice: 'Discord voice frames rx' increases; no 'chunk too large' warnings."
  - "ASR responds to remote user speech; local speakers do not trigger ASR when loopback disabled."
telemetry:
  - "counter.audio.discord.frames_rx"
  - "gauge.audio.discord.rx_errors"
