name: "Configuration: scenarios + in-app diagnostics page"
goal: >
  Group settings by scenario (local, discord, kiosk), validate at load, and add an in-app
  Diagnostics page that highlights misconfigurations and live health signals.

context:
  repo_paths:
    - AppSettings.cs
    - MainWindow.xaml
    - MainWindow.xaml.cs
    - DiscordNativeLoader.cs
    - OnnxSessionFactory.cs
    - KokoroTtsService.cs
    - VoskModelManager.cs
  constraints:
    - Keep existing AppSettings API; add scenario presets + validation routines.
    - Diagnostics UI is a new Tab/Panel with read-only grid & indicators.

steps:
  - AppSettings:
      - Add Scenario setting (Local|Discord|Kiosk).
      - Implement ApplyScenarioDefaults() and Validate(out List<string> errors, out List<string> warnings)
        checking files exist (models, vocoder), device names present, tokens etc.
  - MainWindow Diagnostics tab:
      - Show: Scenario, validation errors/warnings, Telemetry snapshot (from task 0002),
        current EP (CUDA/CPU), audio device selections, Discord connectivity.
      - Use theme-aware colors (green/yellow/red) and a "Copy report" button.
  - On startup:
      - Call AppSettings.Validate(); log via Telemetry and display banner if severe.
  - Add scenario dropdown in UI to apply preset with confirmation.

acceptance_criteria:
  - Switching scenario applies grouped defaults without breaking existing keys.
  - Diagnostics tab shows red/yellow/green for key subsystems and can copy a report.
  - Misconfig (e.g., missing model path) is clearly surfaced at startup and in diagnostics.

files_touched:
  - modify: AppSettings.cs, MainWindow.xaml, MainWindow.xaml.cs
  - optional: small helper view models

labels: [configuration, diagnostics, ux]
