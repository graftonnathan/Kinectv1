task: 0016 - Fix speaker recognition ingestion (windowing & sample rate)
why:
  symptoms:
    - "Often 'Matched speaker: Unknown (score=0.000)' despite audio present."
    - "Intermittent 'Generated speaker embedding' only."
  diagnosis: >
    The embedder expects 1s @16k mono (shape [1,1,16000]). Provide a rolling 1.0s window with 0.5s hop; ensure correct scale and
    silence gating before inference.
scope:
  repo: graftonnathan/Kinectv1
  branch: dev
changes:
  - "SpeakerEmbedder.cs: add RingBuffer(16000), produce windows every 0.5s; normalize RMS; clamp peaks."
  - "VoiceProcessor: feed post-VAD audio into embedder path."
  - "Thresholds: expose in AppSettings; default match minScore=0.6."
steps:
  - "Implement aggregator; skip inference if RMS < -45 dBFS or < 0.2s voiced in window."
  - "Add tests with known WAVs → stable embeddings; verify cosine similarity."
acceptance:
  - "Stable non-zero scores for known voices; 'Unknown' only during silence."
  - "Identity fusion stops flapping on short gaps."
telemetry:
  - "counter.speaker.infer"
  - "gauge.speaker.score"
