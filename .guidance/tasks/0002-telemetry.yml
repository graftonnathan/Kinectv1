name: "Observability: add lightweight structured telemetry (ndjson + counters)"
goal: >
  Add a tiny, dependency-free telemetry layer that logs structured events (ndjson)
  and cheap counters/timers so we can spot regressions (latency spikes, drop/clip rates)
  without reading verbose console output.

context:
  repo_paths:
    - AppSettings.cs
    - AudioUtils.cs
    - DiscordAudioProcessor.cs
    - VoiceRecognizer.cs
    - VoiceProcessor.cs
    - KokoroTtsService.cs
    - CoquiTtsService.cs
    - OnnxSessionFactory.cs
    - MainWindow.xaml.cs
    - JsonUtils.cs
  constraints:
    - .NET Framework 4.8.1; prefer no 3rd-party deps.
    - Sinks: rolling file logs/telemetry.ndjson and console (single-line JSON).
    - Overhead must be negligible in audio/TTS hot loops (no allocations per-call).
    - Thread-safe; ok to use ConcurrentDictionary and ArrayPool.

steps:
  - Create Telemetry.cs with:
      - public static Telemetry.Event(string name, object data=null, TelemetryLevel level=Info)
        writes one JSON object line: {ts, lvl, name, data?, threadId}.
      - public static Counter(inc by name) and Get/Snapshot for debug/diagnostics page.
      - public static LatencyScope(string name) : IDisposable (measures duration with Stopwatch,
        increments counters: name.count, name.total_ms; emits Event at end optionally).
      - Config via AppSettings: TelemetryEnabled (bool), TelemetryFile (string), TelemetrySamplingPct (int).
  - Wire minimal counters:
      - DiscordAudioProcessor: count chunks, compute running rms_avg, drop_count, clip_count; track per-stage ms:
        hp_filter_ms, normalize_ms, resample_ms.
      - VoiceProcessor: asr_partial_ms, asr_final_ms, debounce_skips, final_flushes.
      - KokoroTtsService/CoquiTtsService: tts_generate_ms, tts_stream_segments, tts_cancel_count.
      - OnnxSessionFactory: session_create_ms, ep_cuda_fallbacks.
  - Emit one-line JSON to console & logs/telemetry.ndjson (append, rotate at ~5MB).
  - Add a cheap periodic (every 5s) Telemetry.Event("health.snapshot", {key counters}) from VoiceRecognizer.
  - Update GetVoiceConfidenceSettingsSummary() to print TelemetryEnabled/file.

acceptance_criteria:
  - Running the app produces logs/telemetry.ndjson with valid JSON lines.
  - Console shows single-line JSON events (not multi-line); no excessive spam.
  - Counters visible for: chunks_processed, drop_count, clip_count, asr_final_ms, tts_generate_ms.
  - Overhead: <1% CPU increase compared to baseline (spot-check via Task Manager).
  - Feature toggled by AppSettings.Load("TelemetryEnabled").

files_touched:
  - add: Telemetry.cs
  - modify: AppSettings.cs, DiscordAudioProcessor.cs, VoiceProcessor.cs, KokoroTtsService.cs, CoquiTtsService.cs, OnnxSessionFactory.cs, VoiceRecognizer.cs, MainWindow.xaml.cs

labels: [observability, logging, metrics]
