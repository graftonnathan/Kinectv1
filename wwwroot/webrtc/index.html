<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
    <title>Voice AI</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1E1E1E;
            --surface-light: #2A2A2A;
            --border: #3A3A3A;
            --text: #FFFFFF;
            --text-dim: #B0B0B0;
            --text-muted: #606060;
            --blue: #3B82F6;
            --green: #22C55E;
            --orange: #F59E0B;
            --red: #EF4444;
            --purple: #8B5CF6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }
        .header h1 { font-size: 15px; font-weight: 600; }
        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-dim);
        }
        .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
        }
        .dot.on { background: var(--green); }
        .dot.warn { background: var(--orange); animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.4; } }

        /* 3-Position Switch */
        .switch-container {
            padding: 8px 12px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }
        .switch-track {
            position: relative;
            display: flex;
            background: var(--surface-light);
            border-radius: 8px;
            padding: 3px;
        }
        .switch-option {
            flex: 1;
            padding: 8px 4px;
            text-align: center;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            z-index: 1;
            transition: color 0.2s;
            user-select: none;
        }
        .switch-option.active { color: white; }
        .switch-slider {
            position: absolute;
            top: 3px;
            left: 3px;
            width: calc(33.333% - 2px);
            height: calc(100% - 6px);
            background: var(--green);
            border-radius: 6px;
            transition: left 0.2s ease, background 0.2s ease;
        }
        .switch-slider.pos-1 { left: calc(33.333% + 1px); background: var(--blue); }
        .switch-slider.pos-2 { left: calc(66.666% - 1px); background: var(--purple); }

        /* Chat */
        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .msg {
            max-width: 85%;
            padding: 10px 12px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
        }
        .msg.user {
            align-self: flex-end;
            background: var(--purple);
            border-bottom-right-radius: 4px;
        }
        .msg.ai {
            align-self: flex-start;
            background: var(--surface-light);
            border-bottom-left-radius: 4px;
        }
        .msg.typing {
            background: var(--surface-light);
            padding: 14px 16px;
        }
        .msg.typing span {
            display: inline-block;
            width: 6px; height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            margin-right: 4px;
            animation: dotAnim 1.4s infinite;
        }
        .msg.typing span:nth-child(2) { animation-delay: 0.2s; }
        .msg.typing span:nth-child(3) { animation-delay: 0.4s; margin-right: 0; }
        @keyframes dotAnim { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }
        
        .empty {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Level */
        .level {
            height: 3px;
            background: var(--surface);
        }
        .level-fill {
            height: 100%;
            width: 0%;
            background: var(--purple);
            transition: width 0.1s, background 0.2s;
        }
        .level-fill.mic { background: var(--green); }
        .level-fill.discord { background: var(--blue); }
        .level-fill.webrtc { background: var(--purple); }

        /* Input */
        .input-row {
            display: flex;
            padding: 8px;
            gap: 8px;
            background: var(--surface);
            border-top: 1px solid var(--border);
        }
        .input-row input {
            flex: 1;
            padding: 10px 14px;
            border: none;
            border-radius: 20px;
            background: var(--surface-light);
            color: var(--text);
            font-size: 14px;
            outline: none;
        }
        .input-row input::placeholder { color: var(--text-muted); }
        .input-row button {
            width: 40px; height: 40px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, transform 0.1s;
        }
        .input-row button:active { transform: scale(0.95); }
        .input-row button svg { width: 18px; height: 18px; fill: white; }
        .btn-voice { background: var(--green); }
        .btn-voice.active { background: var(--red); }
        .btn-voice:disabled { background: var(--surface-light); opacity: 0.5; cursor: not-allowed; }
        .btn-send { background: var(--blue); }

        .hidden { display: none !important; }
        audio { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Voice AI</h1>
        <div class="status">
            <span class="dot" id="dot"></span>
            <span id="statusText">Offline</span>
        </div>
    </div>

    <!-- 3-Position Switch: Mic=0, Discord=1, WebRTC=3 (matches AudioInMode enum) -->
    <div class="switch-container">
        <div class="switch-track">
            <div class="switch-slider" id="slider"></div>
            <div class="switch-option active" data-mode="0" onclick="setMode(0)">🎤 Mic</div>
            <div class="switch-option" data-mode="1" onclick="setMode(1)">💬 Discord</div>
            <div class="switch-option" data-mode="3" onclick="setMode(3)">📱 WebRTC</div>
        </div>
    </div>

    <div class="chat" id="chat">
        <div class="empty" id="empty">No messages yet</div>
    </div>

    <div class="level"><div class="level-fill" id="level"></div></div>

    <div class="input-row">
        <input type="text" id="input" placeholder="Type a message...">
        <button class="btn-voice" id="voiceBtn" onclick="toggleVoice()" disabled>
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </button>
        <button class="btn-send" id="sendBtn" onclick="send()">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>

    <audio id="audio" autoplay></audio>

    <script src="client.js"></script>
</body>
</html>
